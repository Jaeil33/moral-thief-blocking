<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="연극 「도덕적 도둑」 배우 동선(Blocking) 뷰어 — 장면 12개, 이동 146건, 자동 검증 오류 0">
</head>
<body>
<title>도덕적 도둑 Blocking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 프롬프트 북 — 위에는 극 전체 눈금자, 아래 왼쪽은 무대 평면도(고정), 오른쪽은 번호 매긴 동선 노트와 대본. 노트 번호 = 지도 번호 = 대본 여백 번호 */
:root {
  --paper: #f2f3ef;
  --sheet: #fbfbf8;
  --ink: #1a201c;
  --muted: #69736c;
  --faint: #a3aca5;
  --rule: #d9ddd6;
  --wall: #2d4637;
  --brass: #94721f;
  --curtain: #2a2f2b;
  --f-display: "Hahmlet", "Nanum Myeongjo", "AppleMyungjo", Georgia, serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --rail-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121614; --sheet: #181d1a; --ink: #e2e6e2; --muted: #98a29b; --faint: #5d6760; --rule: #2c3430;
    --wall: #7da38b; --brass: #cfae5c; --curtain: #c9cfca; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121614; --sheet: #181d1a; --ink: #e2e6e2; --muted: #98a29b; --faint: #5d6760; --rule: #2c3430;
  --wall: #7da38b; --brass: #cfae5c; --curtain: #c9cfca; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1340px; margin: 0 auto; padding-inline: clamp(16px, 3.2vw, 40px); padding-block: 28px 64px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* 제목 블록 */
.title { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 8px 32px; padding-bottom: 18px; border-bottom: 1px solid var(--ink); }
.company { font-size: 13px; color: var(--muted); letter-spacing: .02em; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(30px, 4.6vw, 52px); line-height: 1.05; letter-spacing: -.01em; margin: 6px 0 0; }
.credit { font-size: 14px; color: var(--muted); margin-top: 8px; }
.meta { text-align: right; font-size: 13px; line-height: 1.7; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 600; }
.meta .ver { font-family: var(--f-mono); color: var(--brass); font-size: 13px; }
@media (max-width: 720px) { .title { grid-template-columns: minmax(0, 1fr); } .meta { text-align: left; } }

/* 레일: 눈금자 + 인물 */
.rail { padding-block: 14px 12px; background: var(--paper); border-bottom: 1px solid var(--rule); display: grid; gap: 12px; }
@media (min-width: 1000px) { .rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; } }
.ruler-wrap { overflow-x: auto; scrollbar-width: thin; }
.ruler { display: flex; gap: 4px; min-width: 820px; }
.sc { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.sc-l { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 1px; }
.sc-l .mono { color: var(--ink); margin-right: 4px; font-size: 11px; }
.sc.on .sc-l { color: var(--ink); }
.bts { display: flex; gap: 1px; height: 22px; }
.bt { flex: 1 1 0; min-width: 5px; position: relative; background: var(--rule); transition: background .12s; }
.bt:hover { background: var(--faint); }
.bt[aria-current="true"] { background: var(--ink); }
.bt.mine::after { content: ""; position: absolute; left: 0; right: 0; bottom: -5px; height: 3px; background: var(--c); }
.ruler-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); margin-top: 8px; min-width: 820px; }

.ctl { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; }
.cast { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; font-size: 14px; }
.cast .lab { font-size: 12px; color: var(--muted); margin-right: 2px; }
.per { color: var(--muted); padding-bottom: 2px; border-bottom: 2px solid transparent; display: inline-flex; align-items: center; gap: 6px; }
.per i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--ink)); flex: none; }
.per:hover { color: var(--ink); }
.per[aria-pressed="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--c, var(--ink)); }
.nav { display: flex; align-items: baseline; gap: 18px; font-size: 14px; }
.nav button { color: var(--ink); }
.nav button:disabled { color: var(--faint); cursor: default; }
.nav .count { color: var(--muted); font-size: 13px; }

/* 본문 */
.main { display: grid; gap: 32px; margin-top: 26px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) {
  .main { grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); align-items: start; gap: 40px; }
  .plan { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--rail-h) + 16px); }
}
.plan, .sheet { min-width: 0; }
#map svg { display: block; width: 100%; height: auto; }
.key { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.key span { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.key svg { flex: none; display: block; }
.ends { margin: 18px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 20px; font-size: 13.5px; }
.ends div { display: flex; align-items: baseline; gap: 8px; min-width: 0; border-top: 1px solid var(--rule); padding-top: 5px; }
.ends dt { color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.ends dt i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.ends dd { margin: 0 0 0 auto; font-family: var(--f-mono); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ends .off dd { color: var(--muted); }
.ends .dim { opacity: .35; }
.cap-h { font-size: 12px; color: var(--muted); margin: 22px 0 0; }

/* SVG 도면 */
.s-floor { fill: var(--sheet); }
.s-hatch { stroke: var(--rule); stroke-width: 1; }
.s-cross { stroke: var(--faint); stroke-width: 1; }
.s-zone { fill: var(--faint); font-family: var(--f-mono); font-size: 11px; }
.s-wall { fill: var(--wall); }
.s-curtain { fill: none; stroke: var(--curtain); stroke-width: 1.6; stroke-linejoin: round; }
.s-win { fill: var(--sheet); stroke: var(--wall); stroke-width: 1.4; }
.s-out { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.3; }
.s-thin { fill: none; stroke: var(--muted); stroke-width: 1; }
.s-brass { fill: none; stroke: var(--brass); stroke-width: 1.6; }
.s-brassf { fill: var(--brass); }
.s-edge { stroke: var(--ink); stroke-width: 2; }
.s-seat { fill: none; stroke: var(--faint); stroke-width: 1; }
.s-t { fill: var(--muted); font-family: var(--f-body); font-size: 12px; }
.s-t.ink { fill: var(--ink); }
.s-t.sm { font-size: 11px; }
.sp0 { stop-color: var(--brass); stop-opacity: .38; }
.sp1 { stop-color: var(--brass); stop-opacity: 0; }
.p-line { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.p-line.run { stroke-dasharray: 7 5; }
.p-num circle { fill: var(--sheet); stroke-width: 1.5; }
.p-num text { font-family: var(--f-mono); font-size: 11px; font-weight: 500; text-anchor: middle; dominant-baseline: central; }
.ghost { fill: none; stroke-width: 1.5; stroke-dasharray: 2.5 3; }
.tk text { font-family: var(--f-mono); font-weight: 500; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.tk .body { stroke: var(--sheet); stroke-width: 2; }
.tk.off .body { fill: var(--sheet); stroke-width: 1.6; }
.tk .ring { fill: none; stroke: var(--brass); stroke-width: 1.4; stroke-dasharray: 3 2.5; }
.dim { opacity: .2; }

/* beat 시트 */
.sheet { display: grid; gap: 22px; }
.bh { display: grid; gap: 6px; }
.bh-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.bid { font-family: var(--f-mono); font-size: 22px; font-weight: 500; }
.bl { font-family: var(--f-mono); font-size: 14px; color: var(--brass); }
.bs { font-family: var(--f-display); font-weight: 500; font-size: 16px; color: var(--muted); }
.summary { font-size: 18px; line-height: 1.55; margin: 0; text-wrap: pretty; max-width: 40em; }
.cues { display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 13.5px; }
.cues dt { color: var(--muted); font-size: 12px; }
.cues div { display: flex; gap: 8px; align-items: baseline; }
.cues dd { margin: 0; }
.cues .mono { color: var(--brass); font-size: 12.5px; margin-right: 6px; }
.focus { font-size: 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; padding: 10px 0; border-block: 1px solid var(--rule); }
.focus b { font-weight: 600; }
.focus button { color: var(--ink); text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
.focus button:disabled { color: var(--faint); text-decoration: none; cursor: default; }
.h2 { font-size: 12px; color: var(--muted); margin: 0 0 6px; font-weight: 500; }
.notes { list-style: none; margin: 0; padding: 0; }
.notes li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 0 12px; padding: 12px 0; border-top: 1px solid var(--rule); }
.notes li:last-child { border-bottom: 1px solid var(--rule); }
.num { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--c); color: var(--c); display: grid; place-items: center; font-family: var(--f-mono); font-size: 11.5px; font-weight: 500; margin-top: 1px; }
.n1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
.n1 .nm { font-weight: 600; }
.n1 .with { color: var(--muted); font-size: 13px; }
.n1 .route { font-family: var(--f-mono); font-size: 13px; }
.n1 .run { font-size: 12px; color: var(--brass); }
.n2 { margin: 3px 0 0; }
.n3 { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.n3 .mono { color: var(--brass); margin-right: 8px; font-size: 12px; }
.notes li.dim { opacity: .3; }
.still { margin: 0; padding: 12px 0; border-block: 1px solid var(--rule); color: var(--muted); font-size: 14px; }
.acts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 14.5px; }
.acts li { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 12px; }
.acts .mono { color: var(--brass); font-size: 12px; padding-top: 2px; }
.acts .why { display: block; color: var(--muted); font-size: 13px; }
.acts li.dim { opacity: .3; }
.props { margin: 0; padding: 0; list-style: none; font-size: 14px; display: grid; gap: 2px; }
.props li::before { content: "— "; color: var(--faint); }
.aside { margin: 0; padding-left: 14px; border-left: 2px solid var(--brass); font-size: 14px; color: var(--ink); }

/* 대본 (프롬프트 북) */
.book { background: var(--sheet); border-top: 1px solid var(--ink); max-height: 460px; overflow: auto; padding-block: 8px; }
.ln { display: grid; grid-template-columns: 44px 38px minmax(0, 1fr); gap: 0 8px; padding: 3px 14px 3px 0; font-size: 14.5px; line-height: 1.6; }
.ln .no { font-family: var(--f-mono); font-size: 11.5px; color: var(--faint); text-align: right; padding-top: 3px; }
.ln .mk { display: flex; flex-direction: column; align-items: center; gap: 3px; padding-top: 2px; }
.ln .mk .num { width: 18px; height: 18px; font-size: 10px; border-width: 1.3px; margin: 0; }
.ln .tx { min-width: 0; }
.ln.dir .tx { color: var(--muted); font-style: italic; }
.ln .who { font-weight: 600; margin-right: 8px; }
.ln .q { display: inline-block; font-family: var(--f-mono); font-style: normal; font-size: 11px; color: var(--brass); border: 1px solid var(--brass); padding: 0 5px; margin-right: 8px; line-height: 1.55; }
.ln.mine { background: color-mix(in srgb, var(--brass) 12%, transparent); }

/* 끝 부분 */
.end { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--ink); display: grid; gap: 28px 48px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .end { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); } }
.end h2 { font-family: var(--f-display); font-weight: 500; font-size: 20px; margin: 0 0 12px; }
.qs, .ws { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; font-size: 14px; }
.qs li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; }
.qs .mono { color: var(--brass); font-size: 12.5px; padding-top: 2px; }
.qs b { display: block; font-weight: 600; }
.qs span span { color: var(--muted); }
.ws li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; }
.ws .mono { font-size: 12px; color: var(--muted); padding-top: 2px; }
.foot { margin-top: 28px; font-size: 12.5px; color: var(--faint); }
@media (prefers-reduced-motion: reduce) { .bt { transition: none; } }
</style>

<div class="wrap">
  <header class="title">
    <div>
      <div class="company" id="company"></div>
      <h1 id="play"></h1>
      <div class="credit" id="credit"></div>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <nav class="rail" id="rail" aria-label="장면과 beat">
    <div class="ruler-wrap">
      <div class="ruler" id="ruler" role="group" aria-label="극 전체 눈금자 — beat 선택"></div>
      <div class="ruler-scale mono" id="scale"></div>
    </div>
    <div class="ctl">
      <div class="cast" id="cast" role="group" aria-label="인물 골라 보기"></div>
      <div class="nav">
        <button type="button" id="prev">← 이전</button>
        <span class="count mono" id="count"></span>
        <button type="button" id="next">다음 →</button>
      </div>
    </div>
  </nav>

  <main class="main">
    <section class="plan" aria-label="무대 평면도">
      <div id="map"></div>
      <div class="key">
        <span><svg width="28" height="8" aria-hidden="true"><line x1="1" y1="4" x2="27" y2="4" stroke="currentColor" stroke-width="2.2"/></svg>걷기</span>
        <span><svg width="28" height="8" aria-hidden="true"><line x1="1" y1="4" x2="27" y2="4" stroke="currentColor" stroke-width="2.2" stroke-dasharray="6 4"/></svg>달리기</span>
        <span><svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2 2.5"/></svg>이동 전 자리</span>
        <span><svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>무대 밖</span>
        <span>좌우는 객석에서 본 기준</span>
      </div>
      <p class="cap-h">beat가 끝날 때 각 인물의 자리</p>
      <dl class="ends" id="ends"></dl>
    </section>
    <section class="sheet" id="sheet" aria-live="polite"></section>
  </main>

  <section class="end">
    <div>
      <h2>확인이 필요한 것</h2>
      <ul class="qs" id="qs"></ul>
    </div>
    <div>
      <h2>자동 검증에 남은 경고</h2>
      <ul class="ws" id="ws"></ul>
    </div>
  </section>

"],"order":1,"trigger":"L654 '일동: 안돼!!!'","purpose":"네 사람의 고함에 질려 뒷걸음질 친다"}],"actions":[],"props":[],"start":{"도둑":"OFF_R","도둑아내":"OFF_R","남자":"M2","여자":"M4","안나":"B3","안토니오":"F4","도둑2":"M3"},"end":{"도둑":"OFF_R","도둑아내":"OFF_R","남자":"M2","여자":"M4","안나":"B3","안토니오":"F4","도둑2":"M3"}},{"id":"S12-05","scene":"S12","lines":[661,670],"summary":"거짓말의 합창 — 도둑2가 소파에 쓰러진다 — 암전","sound":["음향17"],"light":"L670 암전","voices":[],"notes":"","moves":[],"actions":[{"who":"도둑2","line":668,"what":"뒷걸음질하다 소파에 주저앉고 결국 드러눕는다","purpose":"말의 공세에 압도당하는 마지막 그림"},{"who":"안나","line":668,"what":"네 사람이 소파 위로 몸을 숙여 말을 쏟아낸다","purpose":"불성실한 네 사람의 합창"}],"props":[],"start":{"도둑":"OFF_R","도둑아내":"OFF_R","남자":"M2","여자":"M4","안나":"B3","안토니오":"F4","도둑2":"M3"},"end":{"도둑":"OFF_R","도둑아내":"OFF_R","남자":"M2","여자":"M4","안나":"B3","안토니오":"F4","도둑2":"M3"}}],"script":{"30":{"t":" 도둑이 창 밖에서 창문을 따고 들어온다. 손전등을 켜고 있다. 여기는 고급 빌라의 3층이다. 실내 한쪽에 전등 스위치가 있다. 그는 주위를 살핀다. 어둠 속에 가구, 카펫, 값비싼 고미술품이 서서히 보이기 시작한다. 도둑은 블라인드를 내리고 중앙선반에 있는 물건들을 훔치려고 할 때 무언가 떨어지는 소리에 화들짝 놀란다. 전등 스위치를 켜고 불이 켜진 고급 빌라 내부를 보고 감탄한다. 이번엔 소파 옆에 있는 서랍을 보고 막 열려고 할 때 전화 벨이 울린다. ","s":null},"32":{"t":"도    둑 : 놀랬잖아!","s":"도둑"},"34":{"t":" 자지러지게 놀라 급히 도망치려다가, 집안에 전화 받을 사람이 없다는 걸 깨닫고 겁먹을 이유가 없게 되자 원래 있던 곳으로 되돌아온다. 울리는 전화 벨을 무시하고 무대 맨 오른쪽 테이블을 물건들을 훔치려 하지만 뜻대로 되지 않는다. 전화기로 조심스레 다가가더니 재빨리 손을 뻗는다. 수화기를 움켜쥐더니 질식시키려는 듯 가슴에다 꼭 붙이고 웃옷자락으로 마치 이 행위가 더 흉악한 범죄를 저지르는 것처럼, 숨넘어가는 듯한 소리가 점차 가냘프게 수화기에서 들려온다.","s":null},"36":{"t":"도둑아내 : 여보세요. 여보세요. 대답 좀 해요. 거기 누구세요?","s":"도둑아내"},"38":{"t":" 도둑은 마침내 진정된 듯 한숨을 내쉰다. 목소리는 중단된다. 도둑은 상의를 펼치고 수화기를 꺼내 조심스레 귀에 댄다. 그리고는 수화기를 몇 번 흔들자 목소리 같은 것이 들린다.","s":null},"40":{"t":"도    둑 : 아, 네...","s":"도둑"},"41":{"t":"도둑아내 : 아... 여보세요... 누구세요?","s":"도둑아내"},"42":{"t":"도    둑 : (또 한 번 깜짝 놀라며) 마리아? 당신이야?","s":"도둑"},"43":{"t":"도둑아내 : 응. 나야. 왜 말을 안해?","s":"도둑아내"},"45":{"t":" 이때 픗라이트 하나가 켜지며, 아직 어둠 속에 있는 무대 한쪽에 전화 통화를 하는 여자의 모습이 나타난다.","s":null},"47":{"t":"도    둑 : 미쳤군! 일하는데 웬 전화야? 딴 사람이 받으면 어쩔려구. 도대체 도움이 안돼.","s":"도둑"},"48":{"t":"도둑아내 : 집주인은 시골 별장에 갔다며... 하여튼 미안해. 걱정이 돼서 견딜 수가 있어야지. 불안해서... 좀 아까 전화했을 땐 숨도 크게 못 쉬었어.","s":"도둑아내"},"49":{"t":"도    둑 : 미안해. 꿈에나 생각했겠어. 설마 당신이 전화할 줄...","s":"도둑"},"50":{"t":"도둑아내 : 아니, 왜","s":"도둑아내"},"51":{"t":"도    둑 : 왜는, 그냥... 일해야 돼... 나 시간 없어.","s":"도둑"},"52":{"t":"도둑아내 : 아, 내가 귀한 시간 뺏는다구! 고마워. 난 걱정이 돼서 죽을 지경인데... 뭘 어떡할지도 모르겠구.","s":"도둑아내"},"53":{"t":"도    둑 : 어떤데?","s":"도둑"},"54":{"t":"도둑아내 : 생지옥이지. 다 당신 탓인데... 그렇게 밖에 말 못해, 나한테? 어떻게... 이렇게... 매력적인... 걱정마. 이젠 신경 끊을게. 이제부턴 어딜 가든지 얘기 꺼내지도 마. 알아봤자 괜히 나만...","s":"도둑아내"},"55":{"t":"도    둑 : 이봐, 그 좋은 머리로 잘 따져봐... 내가 여기 놀러 왔어?.. 이번 한번만이라도 좀 편안하게 털어보자.","s":"도둑"},"56":{"t":"도둑아내 : 또 시작이야. 자기가 무슨 박해를 받는 순교자야? 다른 도둑이나 들치기들은, 아니 강도도 이런 유난은 안 떨어. 좀도둑이니 망정이지. 안 그랬어봐 정말...","s":"도둑아내"},"57":{"t":"도    둑 : (뒤에서 나는 이상한 소리를 듣고서 본능적으로 송화구를 손으로 가리며) 쉿!","s":"도둑"},"59":{"t":" 다행히, 거대한 추시계가 시간을 알리려는 소리다. 자정을 알린다.","s":null},"61":{"t":"도둑아내 : 뭐야?","s":"도둑아내"},"62":{"t":"도    둑 : (공포에서 벗어나며) 휴- 시계 치는 소리야.","s":"도둑"},"63":{"t":"도둑아내 : 소리가 참 깨끗해! 꽤 오래된 거겠지. 무거워?","s":"도둑아내"},"64":{"t":"도    둑 : (별 생각없이)... 아마 꽤...(불현듯 아내의 의도를 알아차리고) 설마 날더러 그걸 들고 오라는... 내 가끔 당신 생각하면...","s":"도둑"},"65":{"t":"도둑아내 : 아니, 나 땜에 골머리 썩히지 마. 어떻게 내가 그런 기대를 하리라고 생각해... 당신 머리가 어떻게... 나한테 선물을... 어쩜, 그런 멋진 생각을 해!","s":"도둑아내"},"66":{"t":"도    둑 : 정말 미쳤어... 그 큰 걸 가져가면 은식기나 다른 건 어떡하구...","s":"도둑"},"67":{"t":"도둑아내 : 그 안에다...","s":"도둑아내"},"68":{"t":"도    둑 : (비웃는 투로) 냉장고도 갖고 갈까? 아주 멋진 초대형이야, 투도어식.","s":"도둑"},"69":{"t":"도둑아내 : 목소리 낮춰. 거기가 집인 줄 알어.","s":"도둑아내"},"70":{"t":"도    둑 : 미안, 열받게 했잖아.","s":"도둑"},"71":{"t":"도둑아내 : 누가 들으면, 당신 매너 없다고 욕해.","s":"도둑아내"},"72":{"t":"도    둑 : 미안하다니깐.","s":"도둑"},"73":{"t":"도둑아내 : 하여튼, 난 냉장고 말한 적 없어. 너무 커서 놓을 데도 없구. 난 그냥 조그만 거 하나면 돼... 중요한 건 마음이잖아. 선물하는 건 자기니까 알아서 해.","s":"도둑아내"},"74":{"t":"도    둑 : 당신이 원하는 걸 내가 어떻게 알어. 난 따로 생각해둔 게 있어.","s":"도둑"},"75":{"t":"도둑아내 : 그럼, 내가 직접 가서 골라야겠네.","s":"도둑아내"},"76":{"t":"도    둑 : 어휴, 어디 해봐!","s":"도둑"},"77":{"t":"도둑아내 : 보고 싶어, 고급 빌라는 어떤지. 얘기 들으면 친구들은 부러워 죽으려고들 할걸.","s":"도둑아내"},"78":{"t":"도    둑 : 죽고 싶은 건 나야, 그 여편네들이 아니고... 난 이 집을 털러 왔어. 그걸 몰라? 안녕, 이따가 봐.","s":"도둑"},"79":{"t":"도둑아내 : 뭐가 그렇게 바뻐? 어쩌다 기분 한번 맞춰주는 게 그렇게 힘들어? 난 당신 아내야. 딴년들처럼 신고만 하고 사는 게 아니라 우린 성당에서 정식으로 결혼했다구. 그러니깐 딴 생각 말어.","s":"도둑아내"},"80":{"t":"도    둑 : (안달이 나서) 글쎄. 이따 보재두.","s":"도둑"},"81":{"t":"도둑아내 : 키스는?","s":"도둑아내"},"82":{"t":"도    둑 : 좋아.","s":"도둑"},"84":{"t":" 도둑은 우스꽝스럽게 입술을 내밀더니 커다랗게 키스 소리를 낸다.","s":null},"86":{"t":"도둑아내 : 나 사랑해?","s":"도둑아내"},"87":{"t":"도    둑 : 사랑하지.","s":"도둑"},"88":{"t":"도둑아내 : 아주 많이?","s":"도둑아내"},"89":{"t":"도    둑 : (인내심이 극에 달해) 아주, 아주, 아주 많이. 이젠 전화 끊을래?","s":"도둑"},"90":{"t":"도둑아내 : 자기 먼저.","s":"도둑아내"},"91":{"t":"도    둑 : 그래, 나 먼저.","s":"도둑"},"93":{"t":" 그가 전화를 내려놓으려 할 때 아내의 우렁찬 목소리가 귓전을 때린다.","s":null},"95":{"t":"도둑아내 : 선물 잊지 마!","s":"도둑아내"},"97":{"t":" 도둑은 수화기를 내려놓으며 혐오에 찬 시선으로 전화통을 노려본다. 이때 도둑 아내의 모습은 어둠 속에 묻힌다. 도둑은 마침내 혼자가 되자, 훔칠 물건을 찾을 심산으로 서서히 실내를 둘러본다. 그는 서랍을 연다. 찾고 있던 물건을 발견한다. 들고 있던 자루에 물건을 담기 시작할 때 출입문에서 자물쇠가 딸가닥거리는 소리가 들리고, 도둑은 흠칫 놀란다. 무대 밖에서 목소리가 들린다.","s":null},"99":{"t":"여    자 : 거실에 불이 켜 있네요. 가슴이 떨려요. 도로 나가요.","s":"여자"},"100":{"t":"남    자 : 진정해요. 내가 안 끄고 나갔나 보죠.","s":"남자"},"101":{"t":"여    자 : 혹시... 부인이 돌아온 거 아녜요?","s":"여자"},"103":{"t":" 그동안 도둑은 공포에 질려 창문 밖으로 빠져나가려 애쓰지만, 시간이 너무 지체되어 실패한다. 그는 대형 추시계 안으로 뛰어든다.","s":null},"105":{"t":"남    자 : (조심스레 들어오며) 그 사람이? 여길 왜 와요? (구석구석 샅샅이 훑어보며) 여기 불이 난다 해도 안 올거요. 안나, 안나~ 자 봐요. 됐죠? 아무도 없잖아요.","s":"남자"},"106":{"t":"여    자 : (여전히 경계와 의혹 속에서) 양심에 찔려요. (모피코트 벗는 걸 남자가 도울 때) 절 어찌 생각하세요. 이렇게 쉽게 따라온 건 제 잘못이에요. 부인은 저보다 시간을 더 오래 끌었겠죠.","s":"여자"},"107":{"t":"남    자 : 지금 그 사람 얘기를 왜 꺼내요? 내 마누라, 본래 콤플렉스 투성이에다 프티 부르주아 근성으로 꽉 찬 여자예요. 시간을 끌 위인이 못 되니 바로 결혼했겠죠.","s":"남자"},"108":{"t":"여    자 : (트집 잡으며) 네, 프티 부르주아 근성에다 콤플렉스 투성이라 해도 그런 여자하고 결혼했잖아요. 나한테도 그렇게 대할 수 있어요?","s":"여자"},"109":{"t":"남    자 : (그녀를 무대 가운데 소파로 데려가며) 내 장담하지만, 설령 내 아내가 구닥다리가 아니고 당신 남편이 그런 냉혈동물이 아니었다 해도, 우린 만날 수 밖에 없는 운명이었다니까. ","s":"남자"},"110":{"t":"여    자 : (여자, 일어나며) 기분 잡쳤어요. (여자가 소파에서 일어나자 남자가 균형을 잃고 넘어진다) 왜 하필 지금 남편 얘기를 꺼내요. 이젠 날 더러 어쩌란 말예요. 후회가 되고 죄책감도...","s":"여자"},"111":{"t":"남    자 : 그런 게 아니라... 내말은... (사이) 미안해요. (일어나서 소파를 바로 한다) 다른 얘길 해요. 그러다 보면 다시 잊게 되고, 그때는 저기로...","s":"남자"},"112":{"t":"여    자 : 어디요?","s":"여자"},"113":{"t":"남    자 : (어색하게) 침실.","s":"남자"},"114":{"t":"여    자 : 좋은 생각 같네요. 해 보죠.","s":"여자"},"115":{"t":"남    자 : (기대에 부풀어) 침실로 가자고요?","s":"남자"},"116":{"t":"여    자 : 아니, 얘길 하자고요.","s":"여자"},"117":{"t":"남    자 : 들어가서 하죠.","s":"남자"},"118":{"t":"여    자 : (소파에 다시 앉으며) 다그치지 마세요. 그냥 대화를 해요. 어릴 때 얘길 해 보세요. 난 어린애들이 좋아요.","s":"여자"},"119":{"t":"남    자 : (마지못해 포기하며 다시 소파에 따라 앉는다) 그러죠. 어릴 때면 뭐, 다섯 살 때 얘기를 해보죠. 그 이전은 기억이 없거든요.","s":"남자"},"120":{"t":"여    자 : 다섯 살? 난 더 어린게 좋은데. 더 순진하고, 악의도 없고, 귀엽고. 근데 뭐 어쩔 수 없죠.","s":"여자"},"121":{"t":"남    자 : 아무튼 그러니까... 제가.. 다섯 살 때... 얼마나 귀여웠게요? ","s":"남자"},"123":{"t":" 여자, 억지로 웃는다.","s":null},"125":{"t":"남    자 : (큰소리로 짜증스럽게) 빌어먹을, 이런 멍청한 짓을 관두죠. 지난 시간 내내 당신 날 바보 취급했어요. 처음엔 내 아내 얘기로, 다음엔 당신 남편 얘기로... 불쌍한 놈, 그 친구 이런 실랑이를 어떻게 참았지...","s":"남자"},"126":{"t":"여    자 : 그 사람은 전혀 그럴 필요 없었어요. 금방 넘어갔으니까요.","s":"여자"},"127":{"t":"남    자 : (놀라며) 금방 넘어갔다니?","s":"남자"},"128":{"t":"여    자 : 말 그대로죠. 그 사람을 우리 집으로 불러들인게 나고 정복한 것도 나였어요. (우쭐대며) 사랑에서 정복의 쾌감을 빼면 뭐가 남겠어요. 그 사람 본래 줏대가 없는 사람이니 바로 항복했죠. (사이) 난 그런 사람 싫어요. 하지만 당신은 느낌이 달라요. 당신은 한 번 한다 하면 하는 사람이에요. 마음먹은 대로 결행하세요.","s":"여자"},"129":{"t":"남    자 : 난 한번 한다 하면 하는 사내요. 당장 들어갑시다.","s":"남자"},"131":{"t":" 전화벨 소리가 울린다.","s":null},"133":{"t":"남    자 : 누구지?","s":"남자"},"134":{"t":"여    자 : 혹시... 부인?","s":"여자"},"135":{"t":"남    자 : 내 집사람이... 왜 전화를 해? 누구한테?","s":"남자"},"136":{"t":"여    자 : 당신한테잖아요!","s":"여자"},"137":{"t":"남    자 : 나한텐 아냐. 내가 어머니 댁에 있는 걸로 알텐데. 벨소리가 장거리 전화 같지는 않아. 음란 전화나, 뭐 잘못 걸려온 전화일거요. (다시 팔짱을 끼며) 들어갑시다. 금방 그칠 테니.","s":"남자"},"139":{"t":" 그러나 아랑곳없이 전화 벨은 계속 울린다.","s":null},"141":{"t":"여    자 : 차라리 받아요. 미치겠어요.","s":"여자"},"142":{"t":"남    자 : (전화기로 가서 수화기를 집어 전화 탁자의 서랍 속에 넣는다) 자, 이젠 신경 쓸 일 없어요.","s":"남자"},"143":{"t":"여    자 : (절망감에서) 뭐 하는 거예요? 당신이 집에 있다는 걸 알리는 셈이잖아요.","s":"여자"},"144":{"t":"남    자 : (여자 말이 옳다는 걸 깨닫고, 낙담하여) 이런 멍청이! 맞아. 혼자 있는 게 아니라고 의심할지도 몰라. 몰래 뭔가 나쁜 짓을 하는 줄 알거야.","s":"남자"},"145":{"t":"여    자 : 참 고맙군요. 왜 솔직히 말 못해요? 나한테 원하는 건 하나밖에 없다구! (눈물을 왈칵 쏟으며) 내 잘못이니 그 댓가를 받는 거죠.","s":"여자"},"146":{"t":"남    자 : (자신을 통제하는 양 보이려고 최대한으로 노력하며) 제발, 오해 말아요. 마음을 좀 가라 앉히구... 진정합시다.","s":"남자"},"147":{"t":"여    자 : 진정하게 생겼어요?","s":"여자"},"148":{"t":"남    자 : 아니 근데, 아까 전화 받는 사람이 꼭 나라고 생각해야 하는 이유가 뭐죠? 받는 거야, 누구든지...","s":"남자"},"150":{"t":"그는 어떻게 말을 이어야 할지 모른다.","s":null},"152":{"t":"여    자 : (빈정거리며) 그럼요, 지나가던 아무나...","s":"여자"},"153":{"t":"남    자 : (어색하게, 확신 없이) 그렇죠.","s":"남자"},"154":{"t":"여    자 : (같은 어조로) 우연히 지나가다가, 가령 도둑처럼...","s":"여자"},"155":{"t":"남    자 : 그것도 가능하죠...(어리석음을 깨닫고서) 도둑? 그렇게 생각한다면, 경찰을 부를텐데.","s":"남자"},"156":{"t":"여    자 : 어머! 벌써 신고했을..지도...(겁에 질려) 우리 두 사람을 보면 체포할 거에요. (그의 비명을 지르듯) 경찰! 안돼! 집에 갈래요.","s":"여자"},"158":{"t":" 그렇게 말하며 여자는 문 쪽으로 뛰어가고 남자는 뒤따라가 붙잡으려 한다. 바로 그때 겁에 질린 도둑이 숨어 있던 곳에서 나온다.","s":null},"160":{"t":"남    자 : (거실 바깥에서) 어딜 가요? 진정해요.","s":"남자"},"161":{"t":"도    둑 : 경찰! 안돼! 나하곤 상극이야. 어디로 도망가지?","s":"도둑"},"162":{"t":"남    자 : 잠깐만요, 애들처럼 왜 그래요?","s":"남자"},"163":{"t":"여    자 : 겁이 나요. 빨리 나가죠.","s":"여자"},"164":{"t":"남    자 : 갈 땐 가더라도 코트는 걸쳐야죠.","s":"남자"},"165":{"t":"여    자 : 모피코트! 내 정신 좀 봐!","s":"여자"},"167":{"t":" 그동안 도둑은 창문으로 빠져나갈지 두 사람이 나갈 때까지 기다릴지 결정을 못 내린다. 그러나 되돌아오는 소리를 듣고서 그전에 숨어 있던 곳으로 돌진한다.","s":null},"169":{"t":"도    둑 : 다시 와! 도리가 없지. (추시계 몸체 속으로 다시 기어들어갈 때 머리가 추에 부딪혀 ‘댕’하는 소리가 난다) 아야! 이놈의 시계를... ","s":"도둑"},"170":{"t":"여    자 : (겁에 질려) 뭐죠?","s":"여자"},"171":{"t":"남    자 : (미소를 띠며) 별거 아녜요. 시계가 한시를 쳤소.","s":"남자"},"172":{"t":"여    자 : 미안해요. 신경이 곤두서서...","s":"여자"},"174":{"t":" 남자가 손에 든 모피코트를 여자에게 입힌다. 그때 여자는 수화기가 여태 내려져 있는 것을 알아차린다.","s":null},"176":{"t":"여    자 : 당신도 얼이 빠졌네요! 수화길 내려놓은 채 그냥 갈 뻔했잖아요.","s":"여자"},"178":{"t":" 여자가 수화기를 제자리에 놓자마자 전화 벨이 울린다. 두 사람은 서로를 쳐다보며 다시 겁에 질린다. 남자는 마치 전화벨 소리에 최면이라도 걸린 듯 수화기를 움켜잡고 천천히 귀에 갖다댄다.","s":null},"180":{"t":"남    자 : (긴장된 목소리로) 여보세요.","s":"남자"},"182":{"t":" 전과 같이 도둑의 아내 모습이 나타나고, 동시에 지극히 화가 난 목소리가 들린다.","s":null},"184":{"t":"도둑아내 : 참, 빨리도 받는다! 한 시간 내내 걸었어. 왜 통화가 안된 거야?","s":"도둑아내"},"185":{"t":"여    자 : 누구에요?","s":"여자"},"186":{"t":"남    자 : 실례지만, 누구신지..?","s":"남자"},"188":{"t":" 그의 애인은 수화기에 귀를 바짝 대고 듣는다.","s":null},"190":{"t":"도둑아내 : 얼씨구! 이젠 마누라 목소리도 몰라.","s":"도둑아내"},"191":{"t":"여    자 : (기절할 듯이) 부인이에요! 그럴 줄 알았어! 어떡해!","s":"여자"},"192":{"t":"도둑아내 : 누구야, 옆에 있는 게? 흥! 분명히 여자 목소린데... 누구야?","s":"도둑아내"},"193":{"t":"남    자 : (애인에게로 돌아서며) 진정해요. 뭔가 잘못됐어. 모르는 사람이라니까. 처음 듣는 목소리야.","s":"남자"},"194":{"t":"도둑아내 : 난 처음이 아닌데? 꽁무니를 빼려고 수를 써. 이 짐승 같은 게. 결국은 꼬리가 잡혔지. 흥, 왜 그 집에 날 못 오게 하나 했더니... 그래, 집에 오기만 해봐...","s":"도둑아내"},"196":{"t":" 도둑은 대화를 이해하려고 숨어 있던 곳에서 내다보다가 그이 아내 목소리를 듣고 안절부절못한다.","s":null},"198":{"t":"남    자 : (전화에다 대고) 여보시오. 전화 잘못 걸었습니다. 여기 프라초시네 집입니다.","s":"남자"},"199":{"t":"도둑아내 : 프라초시, 잘 알지. 세니니가 47번지 303호. 아주 웃겨! 이제 목소리까지 바꿔. 제대로 하지도 못하면서. 나쁜 자식! 방해하지 말라더니... 뭐, 일을 해!","s":"도둑아내"},"200":{"t":"남    자 : 일을 해? 누가요?","s":"남자"},"201":{"t":"도둑아내 : 일을 해? 딴 여자하고 놀아나는 게? 배신자, 사기꾼! 도둑놈은 다 가짜라더니... 아니, 다 거짓말쟁이라더니.","s":"도둑아내"},"202":{"t":"남    자 : 가짜니, 도둑이니 누구한테 하는 말이오? ","s":"남자"},"203":{"t":"도둑아내 : 내 남편한테지. 누구겠어?","s":"도둑아내"},"204":{"t":"남    자 : 난 당신 남편이 아니라니까. 내 마누라는 내가 여기 없는걸로 아니까... 이런, 제기랄...","s":"남자"},"205":{"t":"여    자 : 우린 끝장이야!","s":"여자"},"206":{"t":"도둑아내 : 우선, 내 남편은 가짜가 아니라 진짜 도둑이오.","s":"도둑아내"},"207":{"t":"남    자 : 장하십니다.","s":"남자"},"208":{"t":"도둑아내 : 당신이 내 남편이 아니면 그 집에서 뭘 하는 거죠?","s":"도둑아내"},"209":{"t":"남    자 : 여보시오, 여긴 내 집이오.","s":"남자"},"210":{"t":"도둑아내 : 여기 프라초시네 집인데... (잠시 생각하더니 비꼬는 말투로) 아 ~ 훌륭하시군, 부인이 없는 사이에 딴 여자하고.... 단 둘이 이 야밤에... 하, 시골 간다고 소문 내고서...","s":"도둑아내"},"211":{"t":"여    자 : 들켰어!","s":"여자"},"212":{"t":"도둑아내 : 내 남편하고 똑같애. 배신자, 사기꾼, 거짓말쟁이, 그러니 도둑놈이지.","s":"도둑아내"},"213":{"t":"남    자 : 당신 남편 일이야 내 알 바 아니지만, 내가 시골 간다고 누가 그래요?","s":"남자"},"214":{"t":"도둑아내 : 내 남편이죠. 늘 가는 데를 알리니까. 당신을 열흘 동안 감시했다구요.","s":"도둑아내"},"215":{"t":"남    자 : 뭐요?","s":"남자"},"216":{"t":"도둑아내 : 적당한 때를 노렸죠.","s":"도둑아내"},"217":{"t":"남    자 : 뭘 노려요? 뭐요, 당신 남편이 알려는 게...","s":"남자"},"218":{"t":"여    자 : (손으로 수화기를 가리며) 모르겠어요? 부인이 저 여자 남편한테 미행하라고 시킨 거예요. 틀림없이 흥신소 사람이에요.","s":"여자"},"219":{"t":"남    자 : 아... 남편께선 대단한 일을 하시는군요.","s":"남자"},"220":{"t":"도둑아내 ; 그게 직업이니까요.","s":"도둑아내"},"221":{"t":"남    자 : 훌륭한 직업이죠. 남의 여자더러 남편하고 갈라서라고 부추기는 게 잘하는 짓이라면요.","s":"남자"},"222":{"t":"도둑아내 : 여자더러 갈라서라니... 내 남편이? 말조심해요!","s":"도둑아내"},"223":{"t":"남    자 : 잘 알면서 시치미떼지 말아요. (어조를 바꾸며) 내 아내가... 그 놈과 손잡고 날..! (아는척하며) 이 세상에 믿을 사람이란 없어. 속은 내가 바보지... 내가 전에 뭐랬는지 알아요? 내 아내는 절대 비열한 짓은 안 해. 다른 여자들하고는 달라. 약간 멍청하긴 해도....헌데, 멍청한 건 나였어요.","s":"남자"},"224":{"t":"도둑아내 : 무슨 말씀이에요? 설마... 당신 부인하고 내 남편이...","s":"도둑아내"},"225":{"t":"남    자 : 설마라니? 불 보듯 뻔한 거죠. 바보같은 질문 그만둬요.","s":"남자"},"226":{"t":"도둑아내 : 좋아요. 내 남편 지금 어딨죠?","s":"도둑아내"},"227":{"t":"남    자 : 댁이 모르는 걸 내가 어떻게 알겠소?","s":"남자"},"228":{"t":"도둑아내 : 한 시간 전까지만 해도 그 집에 있었는데요.","s":"도둑아내"},"229":{"t":"남    자 : 여기? 이 집에?","s":"남자"},"230":{"t":"도둑아내 : 직접 통화했어요. 아직 거기 있을 텐데.","s":"도둑아내"},"231":{"t":"여    자 : 당신 부인이 열쇠를 줬을 거예요.","s":"여자"},"232":{"t":"남    자 : 그랬겠지. 낮이든 밤이든 아무 때나 드나들어야 하니까. 지금쯤 포넨테 별장에 있을거요.","s":"남자"},"233":{"t":"도둑아내 : 포넨테 별장? 내 남편이 거긴 왜요?","s":"도둑아내"},"234":{"t":"남    자 : (빈정거리며) 말 않던가요? 뭘 하든 어딜 가든 다 알리는 줄 알았는데. 그쪽 가정의 행복을 위해 주소를 드리죠. 아리스테네 참보니가...","s":"남자"},"235":{"t":"도둑아내 : (수첩을 꺼내며) 잠깐만요. 불러봐요","s":"도둑아내"},"236":{"t":"남    자 : 아리스테네 참보니가 34번지, 포넨테 빌라 전화번호는 7945.","s":"남자"},"237":{"t":"도둑아내 : (해맑게) 34번지, 7935!","s":"도둑아내"},"238":{"t":"남    자 : (화를 내며) 7945!!","s":"남자"},"239":{"t":"도둑아내 : 왜 화를 내고 그래요? 진정해요!","s":"도둑아내"},"240":{"t":"남    자 : 지금 전화하면 받을 거요. 내 집사람이.. 이젠 아니지.","s":"남자"},"242":{"t":" 이 말을 끝내자 홧김에 수화기를 내려놓는다. 여자는 울음을 터뜨리고 도둑의 아내 모습은 사라진다.","s":null},"244":{"t":"여    자 : 큰일났어! 망신이야! 남편이 알면 충격이 클텐데. 그이 모르게 하려고 내가 얼마나 애간장을 태웠다구... 속상해 할까봐 자질구레한 일도 숨기고, 최근 일도... 이제 어쩌지, 들통났으니...","s":"여자"},"245":{"t":"남    자 : 내가 더 문제지. 난 시의원직을 사퇴할 거요. 하지만 이 스캔들이 잠잠해지면 시장으로 추대될거요.","s":"남자"},"246":{"t":"여    자 : 이제 어떡하죠? 도망가든지... 자수하든지...","s":"여자"},"247":{"t":"남    자 : 그럴 필요는 없소. 자수라니! 어디다 자수해요? 왜? 우리가 대체 뭘했는데? 현장을 들킨 것도 아니고, 그저 그냥 대화를 나누며... 어릴 때 얘기밖에 더 했어요?","s":"남자"},"248":{"t":"여    자 : 정말 그래요. 난 어린애가 좋다는 말을 했고.","s":"여자"},"249":{"t":"남    자 : 그래도 그 말은 안하는 게 좋아요. 다들 색안경을 끼고 볼 테니. 미리 입 맞췄다고 그럴텐데... 에이, 속 터져... 차라리 죽어버려?","s":"남자"},"250":{"t":"여    자 : 정말 좋은 생각이에요! 그게 최선이고 유일한 해결책이에요.","s":"여자"},"251":{"t":"남    자 : 유일한 해결책이라니? 미쳤어요? 신문에 날려구! 결혼 주례 50번을 선 시의원, 간통 현장에서 권총 자살, 시의회에서 다들 배꼽 잡고 웃을 거요!","s":"남자"},"252":{"t":"여    자 : 우스워서 좋겠어요. 가만히 생각해보면... 당신은 책임감이 없어요.","s":"여자"},"253":{"t":"남    자 : 내 탓이라니? 우린 함정에 빠진 거요. 내 집사람이 별장에서 올 때까지 한 두시간 기다릴 수밖에... (곰곰이 생각하며) 한 두시간? 잘 활용만 하면... 그렇지... 처벌을 받으려면 죄를 범해야지. (일어나며 소파에 앉아 있는 여자를 끌고 침실로 들어가려 한다) 안으로 들어가죠.","s":"남자"},"254":{"t":"여    자 : 천박하게 왜 이래요?","s":"여자"},"256":{"t":" 여자가 남자를 뿌리치자, 전과 똑같이 남자가 소파에 부딪히며 넘어진다.","s":null},"258":{"t":"남    자 : (손바닥으로 소파를 치며 욕설을 뱉는다) 옘병할! 내가 산 게 뭐 이따위야!","s":"남자"},"259":{"t":"여    자 : 날 손톱만큼이라도 이해를 못해줘요? 난 절망 속에서 허우적거려요.","s":"여자"},"260":{"t":"남    자 : 항상 허풍이지! 절망! 나한테서 뭘 원해? (과장된 태도로) 내가 죽어버려? 좋아, 그러지 뭐. 나한테 총이 있어. (남자는 서랍에서 권총을 꺼내 관자놀이에 갖다댄다) 이제 만족해?","s":"남자"},"261":{"t":"여    자 : 안돼요! 무슨 짓이에요? 이리 주세요.","s":"여자"},"263":{"t":" 여자는 권총을 뺏는다. 남자는, 애인을 놀라게 할 의도로 허세를 부렸기에 가만히 웃는다.","s":null},"265":{"t":"남    자 : (빈정거리지만, 흡족해하며) 왜, 이젠 내가 죽는 게 싫어?","s":"남자"},"266":{"t":"여    자 : 아뇨. 안전장치를 풀고 총알이 있나 봐야죠. (총알이 장전되었는지를 확인하고 그에게 건네준다) 자, 됐어요. 이제 당기세요.","s":"여자"},"267":{"t":"남    자 : (야릇하게 찢어지는 소리로) 쏘..쏜다..","s":"남자"},"268":{"t":"여    자 : (총을 그의 얼굴 높이로 올리며) 해요, 빨리. 집에 온 부인에게 살아있는 꼴을 보일 작정이에요?","s":"여자"},"270":{"t":" 남자가 뻣뻣이 굳은 채 총을 머리에 갖다댈 때, 시계가 12시 반을 친다. 이 소리에 남자는 움찔 놀라더니 공포에 질려 권총을 응시한다.","s":null},"272":{"t":"여    자 : 참 이상한 시계네. 1시를 치더니 다음엔 12시 반... 너무 늦게... 이거 거꾸로 가잖아.","s":"여자"},"273":{"t":"남    자 : 정말 이상해... 이런 일이 없었는데... (사이) 이건 하늘의 계시야. 운명의 손이 내려와 자살하려는 내 손을 붙들며 메시지를 전하는 거야. 이 생명이 끝나면 불귀의 객이 된다고 말야. 운명의 손이여, 감사합니다. 시계가 나를 살렸어!","s":"남자"},"275":{"t":" 이 말을 끝내자, 시계를 마치 살이 있는 사람처럼 열렬히 껴안는다. 시계는 생명을 얻은 것처럼 다시 울린다.","s":null},"277":{"t":"도    둑 : (목소리만. 추가 머리를 강타하자 아픔을 참을 수 없어) 우우우... 빌어먹을... 그만!","s":"도둑"},"278":{"t":"남    자 : (펄쩍 뛰어 뒤로 물러난 뒤, 공포로 굳어있는 여자에게로 뒤로 숨으며) 운명의 화신이야!","s":"남자"},"279":{"t":"도    둑 : (머리를 어루만지며 나온다) 어이쿠, 아파라! 안녕하세요. 시원한 물 한 잔 얻어 마실 수 있을까요?　머리에 온통 혹이 부어 올라서요...","s":"도둑"},"280":{"t":"여    자 : (충격을 받은 듯) 혹이라니! 운명의 화신치고는 천박해!","s":"여자"},"281":{"t":"남    자 : 당신 누구야? 대체 내 집에서 뭘 하는 거야? 대답 안하면 만신창이로 만들어주지.","s":"남자"},"282":{"t":"여    자 : 예의 좀 차리세요. 물 한 모금 주는 거, 별거 아니잖아요?","s":"여자"},"283":{"t":"도    둑 : 네, 한 모금이라면 결코","s":"도둑"},"284":{"t":"남    자 : (도둑을 향해 단호하게 총을 겨누며) 나, 지금 폭발 직전이야. 너 누구야?","s":"남자"},"285":{"t":"도    둑 : (겁에 질려) 총을 겨누실 필요까지야... 한 마디로, 제가 그 남편입니다. 좀 전에 전화했던 여자가 제 아내고, 제가 그 남편이고요.","s":"도둑"},"286":{"t":"남    자 : 아... 당신이... 그 남편이라... 좋아.","s":"남자"},"287":{"t":"도    둑 : 우린 성당에서 결혼했죠.","s":"도둑"},"288":{"t":"남    자 : 행운아네. 성스러운 성당묘지에 묻힐테니.","s":"남자"},"289":{"t":"도    둑 : 묻히다니, 제가! 그렇게는... 안되죠. 당신네들은 권리가 없어요. 나한테 무기가 없다는 걸 아셔야죠. 부인이 증인이요. (여자를 끌고 가려 하지만 실패한다) 누구든 날 쏘면 형법 제 127조에 저촉됩니다. 내가 도망가면 공포탄을 쏠 수 있지만 난 도망을 안 갈 테니 그것도 안되죠. 경고하지만, 날 쏘면 일급 살인이요.","s":"도둑"},"290":{"t":"여    자 : 당신네들은 법에는 전문가죠... 법은 당신네들 편이고. 하지만 스파이를 쏘듯 등 뒤에서 쏘면? (남자에게로 돌아서며) 등에다 쏴요. (도둑에게) 돌아서시죠.","s":"여자"},"291":{"t":"도    둑 : 죄송하지만, 전 첩보 놀이가 싫은데요. 경찰을 부르시죠.","s":"도둑"},"292":{"t":"남    자 : 야, 머리 쓰네. 경찰을 부르자고! 경찰이 불륜관계를 밝혀내면, 우린 보따리를 싸고, 넌 보상금을 챙기겠지!","s":"남자"},"293":{"t":"도    둑 : 보상금? 누가 줘요?","s":"도둑"},"294":{"t":"남    자 : 내 마누라지.","s":"남자"},"295":{"t":"도    둑 : 어디가 아파요? 난 당신 부인 몰라요.","s":"도둑"},"296":{"t":"여    자 : 뻔뻔스럽긴, 모른다고! 당장 쏴요! 신경 거슬려요.","s":"여자"},"297":{"t":"남    자 : 잠깐, 저 안에 얼마나 있었지?","s":"남자"},"299":{"t":"시계를 가리킨다.","s":null},"301":{"t":"도    둑 : 정확히 13분 전 12시. 선생님이 온 뒤로죠. 왜요?","s":"도둑"},"302":{"t":"남    자 : 저 친구가 저 안에 있었다면 아직 전화는 못했어. 잘만 하면 무사할 수 있어.","s":"남자"},"303":{"t":"여    자 : 그렇겠죠. 동네방네 나팔을 불고 다닐 사람하고 같이 있으니.","s":"여자"},"304":{"t":"도    둑 : (무슨 말을 하는 지 이해 못한 채 어떻게든 위험을 벗어나려고 하며) 나팔요! 전 나팔 불 줄 몰라요. 배운 적도 없구요. 거짓말이면 벼락맞죠. (총이 나팔인 양 총구 앞에 입을 갖다대고 나팔을 부는 흉내를 낸다) 보셨죠?","s":"도둑"},"305":{"t":"남    자 : 그렇다고, 죽이면 일은 커지고.","s":"남자"},"306":{"t":"여    자 : 중상을 입힌다면?","s":"여자"},"307":{"t":"남    자 : 이득은?","s":"남자"},"308":{"t":"도    둑 : 전 반댑니다. 무슨 이득이 있겠어요?","s":"도둑"},"309":{"t":"여    자 : 이득이 있죠. 중추신경 중에서 이 부분의... (여자는 남자의 목덜미에 손을 댄다) 1번 경추하고 2번 경추 사이를 강타하면 기억을 말끔히 상실해요.","s":"여자"},"310":{"t":"남    자 : 침실로 가죠!","s":"남자"},"311":{"t":"여    자 :　효과가 확실하군요. 신경이 마비돼서 말을 못할 테니까 우리 입장으로선 마찬가지죠.","s":"여자"},"312":{"t":"도    둑 : (벌써 신경이 마비된 듯) 제 입장은 안 그런데요. 좀 더 안전한 방법이 있지 않을까요? 사모님, 명석한 두뇌로 묘안을 내셔야죠.","s":"도둑"},"313":{"t":"여    자 : (으쓱해서) 그렇게까지 말씀하신다면야. 딴 방법이 있기는 해요. 술을 먹이는 거죠. 주정뱅이 말은 증거로 효력이 없어요.","s":"여자"},"314":{"t":"남    자 : 그래! 당신은 언제 봐도 대단해요.","s":"남자"},"315":{"t":"도    둑 : (안도의 한숨을 쉬고, 박수를 치며) 정말 대단하십니다. 첨 뵙는 순간 단박에 알았죠. 근데, 무슨 술이 있죠? 이왕이면 적포도주로... 백포도주는 소화가 잘 안돼서요. 어릴 때부터 전 백포도주가 입에 대지도 않았어요.","s":"도둑"},"316":{"t":"남    자 : (도둑의 말을 끊으며) 에헷! 와인은 안돼. 너무 오래 걸려. 진이나 위스키... 세 잔이면 될거야.","s":"남자"},"317":{"t":"도    둑 : 저... 위스키는... 휘발유 냄새가 나서...","s":"도둑"},"318":{"t":"여    자 : (그 사이, 잔 가득히 술을 채우고서) 이건 싸구려 술이 아녜요. 진짜 스카치 위스키에요.","s":"여자"},"319":{"t":"남    자 : 어때?","s":"남자"},"320":{"t":"도    둑 : (감정가 같이 맛을 모며) 음... 정말 좋은데요!","s":"도둑"},"321":{"t":"남    자 : (이번엔 그 자신이 마시며) 당연하지. 값이 얼만데.","s":"남자"},"322":{"t":"도    둑 : (주제넘게) 한 잔 더 따르시겠어요?","s":"도둑"},"323":{"t":"남    자 : (술을 채워달라고 잔을 내민 도둑에게) 왜 이리 급해? 당신이 다 마시면 우린 어떡하고?","s":"남자"},"324":{"t":"여    자 : 예의를 지키세요! 어쨌거나 취할 사람은 저쪽이에요.","s":"여자"},"325":{"t":"도    둑 : 맞아요. ","s":"도둑"},"326":{"t":"여    자 : (남자를 가르키며) 당신 아니구.","s":"여자"},"327":{"t":"도    둑 : (점점 대담해지며) 같이 취합시다. 하, 하, 하... 우리 마누라 이 얘기 들어도 안 믿을 걸. (아내에 대한 생각에 얼굴에서 웃음이 사라진다) 말이 나왔으니 말인데, 당신 대체 뭐라고 그랬기에 내 마누라가 그렇게 난리를 친거죠? 난 이제 큰일났어! 당장 전화해서 계략을 설명해요.","s":"도둑"},"328":{"t":"남    자 : 계략? 무슨 계략?","s":"남자"},"329":{"t":"도    둑 : 날 취하게 해서 입 막는 거죠. 뭔가 난처한 일 땜에...","s":"도둑"},"330":{"t":"여    자 : 들었어요? 순 악질이에요. 증인이 필요하대요. 당장 쏴요. 끝내버리죠.","s":"여자"},"331":{"t":"남    자 : 그게 낫겠어. (테이블에 두었던 총을 가지러 갈 때, 도둑이 먼저 집고서 남자를 겨냥한다) 헛수작 말어! 내 총이야! 당장 이리 내.","s":"남자"},"332":{"t":"도    둑 : 입장이 바뀌었어. 당신 땜에 내가 시계추에 얻어맞질 않나, 마누라한테 쫒겨나게 생긴데다... 내 척수신경을 마비시키겠다구? 오락 시간은 끝났어. 난 도둑이지, 광대가 아냐.","s":"도둑"},"333":{"t":"남    자 : 도둑?","s":"남자"},"334":{"t":"도    둑 : 도둑이지. 진짜 도둑.","s":"도둑"},"335":{"t":"여    자 : (재미있어 하는 기색으로) 도둑! 참, 별소리 다 듣겠네. 까만 복면은 어딨죠? 쫄쫄이 옷이랑 소리 안 나는 펠트신발은?","s":"여자"},"336":{"t":"남    자 : 그래, 어딨어?","s":"남자"},"337":{"t":"도    둑 : 까만 복면! 펠트신발! 영화 찍는 줄 알어? 도둑이나 강도가 뭔지 알기나 해?","s":"도둑"},"338":{"t":"여    자 : (으스대며) 나도 도둑, 강도, 사기꾼에 대해 알만큼 알죠. 텔레비전 퀴즈쇼에 출연할 때 내 전문이 “유명 범죄와 절도” 였어요.","s":"여자"},"339":{"t":"남    자 : 아, 그래서 총에 대해 좀 아는구먼, (도둑에게) 쯧, 쯧, 쯧... 운이 없어. 다른 직업을 찾아야겠어.","s":"남자"},"340":{"t":"도    둑 : 이봐, 마르텔로파라고 들어봤어?","s":"도둑"},"341":{"t":"남    자 : 마르텔로파? 도끼파는 들어봤어도, 마르텔로파는 뭐야?","s":"남자"},"342":{"t":"여    자 : (줄줄 외우듯이) 마르텔로파... 주요 멤버가... 만지아, 세라피니, 그리고 안젤로 토르나티, 별명은 스탕카!","s":"여자"},"343":{"t":"도    둑 : 토르나티의 별명은 스탕가야. 카가 아니라 가. 방언으로 위대하다는 듯이지.","s":"도둑"},"344":{"t":"여    자 : 위대해? 무슨 소리예요... 소인이지.","s":"여자"},"345":{"t":"남    자 : (별 생각 없이 대화에 끼여들며) ‘난쟁이’란 말이겠지.","s":"남자"},"346":{"t":"도    둑 : 내가... 난쟁이 같애?","s":"도둑"},"347":{"t":"남    자 : 당신하고 무슨 상관이야?","s":"남자"},"348":{"t":"도    둑 : 무슨 상관이라니? 날 소개하지. 본명 안젤로 토르나티. 별명 스탕가. ","s":"도둑"},"349":{"t":"여    자 : 거짓말 하는거에요. 뻔뻔스럽기도 해라.","s":"여자"},"350":{"t":"도    둑 : 못믿겠어? (안주머니에서 서류를 꺼낸다) 이거 산토 스테파노 형무소에서 발행한 출감 허가증이야. 3년 살았지.","s":"도둑"},"351":{"t":"여    자 : (서류를 보더니 얼굴이 환해진다) 진짠데! 스탕가... 아니 스탕가 선생님, 꿈만 같아요. 결례가 아니라면... (그를 안고서 손에 키스한다) 난생 처음이야. 진짜 도둑이라니... 자세히 봐야돼.","s":"여자"},"352":{"t":"남    자 : (질투가 나서) 무슨 짓이요, 이게? 이 불한당은 내 집을 털러 왔는데, 키스까지... 에이, 더러워.","s":"남자"},"353":{"t":"여    자 : 더럽다니? 말조심해요! 뭘 안다고 그래요. 도둑한테 키스해 봤어요?","s":"여자"},"354":{"t":"남    자 ; 아니.","s":"남자"},"355":{"t":"여    자 : 그럼, 해보고 더러운지 아닌지 말해요.","s":"여자"},"357":{"t":" 그때 현관 벨이 울린다.","s":null},"359":{"t":"여    자 : 누구지?","s":"여자"},"360":{"t":"도    둑 : 내 마누라지. (수화기를 들며) 내 마누라한테 대신 설명해야 돼. 마리아. 나야. 당신 전화 땜에 나 아주 곤란하게 됐어. 몇 번이고 말하지만, 일할 땐 날 좀 내버려 둬. 우리 집에 불이 나더라도 나한테 전화하지 마. 얌전히 집이나 보고 절대 신경 쓰지마. 마리아... 마리아?","s":"도둑"},"361":{"t":"남    자 : 전화 벨이 아니고... 현관 벨이오.","s":"남자"},"362":{"t":"도    둑 : (화난 기색으로 전화기를 보며) 어쩐지... 대꾸를 안한다 했어.","s":"도둑"},"364":{"t":" 전화기를 내려놓는다.","s":null},"366":{"t":"남    자 : (창문을 열고 밖을 내다본다) 누구세요?","s":"남자"},"367":{"t":"안    나 : (목소리) 누구긴 누구에요? 여보, 나예요. 안나.","s":"안나"},"368":{"t":"여    자 : (핼쑥해지며) 어머! 이번엔 진짜 부인이야.","s":"여자"},"369":{"t":"남    자 : (목소리를 천연스럽게 가져가며) 어, 당신이야? 근데, 왜 돌아왔어? 무슨 일 있어?","s":"남자"},"370":{"t":"안    나 : 내가 묻고 싶은 게 그거에요... 웬 미친 여자가 나한테 전화하더니 마구 욕을 해댔다니까.","s":"안나"},"371":{"t":"도    둑 : 미친 여자! 내 마누라야. 그럴 것 같더라니.","s":"도둑"},"372":{"t":"안    나 : 문 열어요. 빨리!","s":"안나"},"373":{"t":"남    자 : 지금 나가... (창문에서 멀어지며) 큰일 났어. 뭐라 그러지?","s":"남자"},"374":{"t":"도    둑 : 자, 모두들 모여봐요. 지금부터 내 말 잘 들어요. 난 갑니다. (창문으로 나가려 한다)","s":"도둑"},"375":{"t":"남    자 : (도둑의 옷깃을 잡으며) 안되지. 그쪽 편리대로? 당신 부부덕에 일이 이 꼴이 됐으니 마무리도 맡아야지.","s":"남자"},"376":{"t":"도    둑 : 날 더러 뭘 어떡하라고?","s":"도둑"},"377":{"t":"남    자 : (여자에게로 돌아서며) 둘이서 부부 행세를 하면 만사가 오케이지.","s":"남자"},"378":{"t":"여    자 : 결혼! 저 사람하고! 서로 소개도 안했는데.","s":"여자"},"379":{"t":"남    자 : 걱정 말아요. 사랑은 차후에 생기는 거니까. 어쨌든 남의 남편 애인보다야 가짜 남편 아내가 되는 게 낫지. (그의 아내를 맞이할 채비를 차리며) 자, 다들 준비됐죠? (총을 거들며) 이건 내가 갖지. 명심할 건, 만약 딴 수작을 부리면... (총을 발사할 태세를 취하며) 이걸 안 썼으면 좋겠어.","s":"남자"},"380":{"t":"여    자 : 어머, 끔찍해. (도둑을 아래위로 훑어보며) 내 남편이 되려면 똑바로 서세요. 잘 좀 보게. 좀 단정하게 입고 다니면 안돼요? 남의 집에 초대받아 가기가 늘 부끄럽다니까... 남자가 정갈치 못하면 여자만 욕먹어요.","s":"여자"},"381":{"t":"도    둑 : 일이 이렇게 될 줄은 몰랐죠. 집에 체크무늬 양복이 있는데, 빨리 가서 갈아입을까요?","s":"도둑"},"382":{"t":"여    자 : 안돼요. 그건. (볼룩한 주머니를 보며) 주머니에 뭐가 그렇게 잔뜩 들었어요?","s":"여자"},"383":{"t":"도    둑 : (양복점 마네킹처럼 몸을 세우며) 요새 유행하는 게 이런 거죠.","s":"도둑"},"384":{"t":"여    자 : 빼요 그냥.","s":"여자"},"385":{"t":"안    나 : (목소리, 밖에서 들려온다) 무슨 일이 있어요? 누가 왔어요?","s":"안나"},"386":{"t":"남    자 : 말한 그대로지. 오해가 있었지만 다 풀렸어.","s":"남자"},"387":{"t":"안    나 : 오해요? 말도 안돼. 어머님 댁에 있을 사람이 어떻게 여기 있어요?","s":"안나"},"388":{"t":"남    자 : (먼저 들어서고 아내가 뒤따른다) 설명한다니까. 이쪽은 내 친구 안젤로 토르나토 박사.","s":"남자"},"389":{"t":"도    둑 : (냉랭하게) 토르나티.","s":"도둑"},"390":{"t":"남    자 : (살짝 웃으며) 미안, 이 분은 부인이시고.","s":"남자"},"391":{"t":"도    둑 : 남편께서 우리 둘을 결혼시켰죠. 사랑은 차후에 생긴다면서...","s":"도둑"},"392":{"t":"남    자 : (입을 막으려고) 공무상... 호적 처리 말이야.","s":"남자"},"393":{"t":"여    자 : 이렇게 불쑥 찾아봬서 죄송해요. 늦었지만 남편께 드릴 말씀이 있어서... 사정이... 보시다시피...","s":"여자"},"394":{"t":"안    나 : (쌀쌀하게) 괜찮아요. 근데, 저한테 전화하신 분이 부인이세요?","s":"안나"},"395":{"t":"여    자 : 그게...그러니까...","s":"여자"},"396":{"t":"남    자 : (재빨리 끼여들며) 그래. 맞는데, 하지만 이해해야 돼. 그땐 정말 심란했거든.","s":"남자"},"397":{"t":"여    자 : 용서하세요. 질투 땜에 보이는 게 없었어요. 제 남편이 부인하고 만난다는 생각에 그만... (안나가 놀란다) 근데, 이렇게 뵈니 왜 그런 생각을 했는지 모르겠어요.","s":"여자"},"398":{"t":"안    나 : 그럼, 제가 한물간 여자나 무슨 괴물 같다는 거예요?","s":"안나"},"399":{"t":"여    자 : 그게 아니라, 아주 우아하시다는 거죠. 제 말은 남편 취향이 좀 천박해서...","s":"여자"},"400":{"t":"도    둑 : 천박하다구? 내가!","s":"도둑"},"401":{"t":"안    나 : 안됐군요. 그런 남편하고 살다보니 같이 천박해졌다니. 그렇다고, 나를 댁의 남편 같은 그런 남자나 만나는 저질로 봐요?","s":"안나"},"402":{"t":"도    둑 : 됐어요. 됐어. 천박하고 저질인 걸로 족해요.","s":"도둑"},"403":{"t":"남    자 : (어떻게든 사태를 진정시키려는 의도에서) 말이 지나쳐. 저 친구 볼품은 없어도 취향에 따라 어울릴 수도 있지.","s":"남자"},"404":{"t":"안    나 : 당신은 내 남편이야! 아내가 모욕을 당해도 화는 안 내고, 뭐 저딴 남자가 애인으로 어울려? 미쳤어!","s":"안나"},"405":{"t":"여    자 : 댁의 남편 말씀은, 여자는 자기가 남편을 사랑하는 경우 다른 여자도 자기 남편을 좋아할거란 거고. 취향이 천박해도 말이에요.","s":"여자"},"406":{"t":"안    나 : (비아냥 거리며) 좋으시겠어요. 내가 남편을 사랑하니 부인도 내 남편을 좋아한다는 거예요? 당장 애인 하시지 그래요?","s":"안나"},"407":{"t":"여    자 : 무슨 그런 말씀을...","s":"여자"},"408":{"t":"안    나 : (도둑에게로 돌아서며) 뭐라고 한 말씀 하셔야죠?","s":"안나"},"409":{"t":"도    둑 : 솔직히 말씀드리면, 아내가 아니라 애인으로 삼을 참입니다. 부인 남편께서 반대만 안하신다면... 우릴 결혼시킨 분이니까, 전적으로...","s":"도둑"},"410":{"t":"안    나 : (갑자기 웃음을 터뜨리자, 다른 사람들도 안나의 눈치를 보며 따라 웃는다) 이렇게 유머가 풍부하시니 부인이 다른 여자를 경계하죠. 위트가 넘치는 남잔 위험해요. 취향이 천박하면 더 위험하죠.","s":"안나"},"411":{"t":"도    둑 : (여자에게) 또 그러네, 내가 천박하다구.","s":"도둑"},"412":{"t":"여    자 : (사랑스럽게 도둑을 팔로 감싸며) 이 남자 정말 위험해요. 부인이야 모르시겠지만.","s":"여자"},"413":{"t":"남    자 : (화난 기색으로) 좀 지나치네요. (태도를 고치며) 남자는 다 위험하죠... 어느 정도는.","s":"남자"},"414":{"t":"안    나 : 절대 당신은 아녜요. 절대. (도둑과 여자가 다정히 손을 잡고 있는 걸 보며) (사이) 어쩜, 신혼부부같에요. 천생연분이야. 안 그래요?","s":"안나"},"415":{"t":"남    자 : (화가 치밀어) 그래... 근데, 이젠 가셔야죠. 시간이 꽤 됐어요.","s":"남자"},"416":{"t":"안    나 : 원, 매너가 없긴... 신경 쓰지 마시고 편히 계세요. 같이 한잔할까요?","s":"안나"},"417":{"t":"도    둑 : 그러죠! 아까 마시던 위스키로.","s":"도둑"},"418":{"t":"여    자 : (속삭이듯) 내려놓아요! ","s":"여자"},"419":{"t":"안    나 : 당신도 마셨어요?","s":"안나"},"420":{"t":"남    자 : 난 한잔도 안마셨어...","s":"남자"},"421":{"t":"여    자 : (경직된 목소리로, 안나에게) 호의는 감사하지만... (도둑은 병을 신기하다는 듯 쳐다본다) 너무 늦었어요. 남편이 오기 전에... (자신의 실언을 깨닫고서) 아니, 남편이 집에 가는게 너무 늦어서요... 저희 집이 꽤 멀어요. 남편은 내일 일찍 일어나야 하기도 하구요. 여보, 그렇지?","s":"여자"},"422":{"t":"도    둑 : 응?","s":"도둑"},"423":{"t":"안    나 : 그냥 여기서 주무세요. 빈방도 있구요. 여보?","s":"안나"},"425":{"t":" 남자, 딴 짓을 하고 있다.","s":null},"427":{"t":"안    나 : 여보~","s":"안나"},"429":{"t":" 남자, 여전히 딴 짓을 하고 있다.","s":null},"431":{"t":"안    나 : (화를 내며) 아 여보! 어떻게 해봐요.","s":"안나"},"432":{"t":"남    자 : (딴 생각을 하다가) 그럼. 주무시고 가야죠. (자신의 실언을 깨닫고서) 내가 뭐랬지, 지금? 그래도, 그거는 아니지 않을까?","s":"남자"},"433":{"t":"도    둑 : (남자의 말에 끼어들며) 아... 우리는 좋습니다.","s":"도둑"},"434":{"t":"안    나 : 거봐요. 여기서 주무시겠다잖아요. 저도 좋아요.","s":"안나"},"435":{"t":"여    자 : (마지막 노력으로) 저, 사실은... 파자마가 없어서요!... 우리 그인 파자마 없인 한숨도 못자요.","s":"여자"},"436":{"t":"안    나 : 그거야.. (남편에게) 당신 파자마 드려요. 새 거 하나 있죠?","s":"안나"},"437":{"t":"남    자 : (절망적으로) 응!","s":"남자"},"438":{"t":"안    나 : (여자에게) 이리 오세요. 방을 보여 드릴게요. 편안하실 거예요. (도둑에게) 부인을 잠시만 뺏어갈게요.","s":"안나"},"440":{"t":" 두 여자는 퇴장하고 두 남자는 남아 서로 쳐다본다. 한 남자의 시선에는 당황함이, 다른 남자의 시선에는 증오가 차있다.","s":null},"442":{"t":"남    자 : 일을 이 지경으로 만들어.. 멍청한 카사노바 같으니... 정말 잘거야, 내... 내... 내 파자마 입고? 그 생각은 버리는 게 좋을 걸.","s":"남자"},"443":{"t":"도    둑 : 애당초 그게 누구 생각인데? 당신 애인 남편 노릇을 하라더니... 이제 와서 왜 야단이야? 평생에 단 하루도 운이 없던 놈이 먹고 살겠다고 여길 왔더니... 망가진 시계 쪼가리 하나 못 건드리게 하지. 거기다가 그쪽 장단에 춤을 추라구! 안돼. 미안하지만, 당장 내 마누라한테 전화해서... 아냐, 당산 부인에게 다 털어놓고 경찰을 부르자고. 경찰한테 심문받는게 나아. 마누라보다는...","s":"도둑"},"444":{"t":"남    자 : 쳇! 말하는 건 경찰 어르고 신사 뺨치네. 물론 화가 나겠지. 뼛골 빠지게 일하는데 우리가 방해했으니. 당신 털러 왔지, 여기? 좋아, 털어가. (그는 은스푼과 포크 세트가 있는 무대 왼쪽 테이블로 향한다) 여기 금 티스푼도 있어. 다 가져가.","s":"남자"},"445":{"t":"도    둑 : (가져가려다가 멈칫한다) 고맙긴 해도 이건 내 식이 아냐. 다음 기회로 미루지.","s":"도둑"},"446":{"t":"남    자 : (안달이 난다. 주머니에서 총을 꺼낼 듯) 그래? 그렇다면... 이거 뭔지 알지!","s":"남자"},"447":{"t":"도    둑 : 정 그렇다면. (시계 뒤에서 자루를 가져와 물건들을 담는다) 정말 탐나는 물건이네.","s":"도둑"},"448":{"t":"남    자 : (총을 꺼내 위협적으로) 깡그리 털어가. 우리 집에 별로 훔칠 게 없다느니, 우리가 강도를 이용한다느니 나중에 딴소리 말고.","s":"남자"},"449":{"t":"도    둑 : 그런 말 안했는데.","s":"도둑"},"450":{"t":"남    자 : 그렇게 말할 타입이야. ","s":"남자"},"452":{"t":" 그는 방에 들어가 골드바를 가져오고, 바닥에 던진다.","s":null},"454":{"t":"남    자 : (화를 내며) 이것도 가져.","s":"남자"},"455":{"t":"도    둑 : 이런 극진한 대접을 남용하긴 싫은데.","s":"도둑"},"456":{"t":"남    자 : 자책은 접어두고 일이나 하지. 여기 총 있어!","s":"남자"},"458":{"t":" 바로 그때 도둑의 아내가 들어온다. 남자가 남편에게 총을 겨눈 걸 보더니 비명을 지르면서 두 사람 사이로 뛰어들어 남편에게 매달린다.","s":null},"460":{"t":"도    둑 : 마리아! 여길 어떻게...","s":"도둑"},"461":{"t":"도둑아내 : 문이 열렸던데.","s":"도둑아내"},"462":{"t":"도    둑 : 난 3층까지 파이프 타고 올라왔어.","s":"도둑"},"463":{"t":"도둑아내 : 여보, 내가 잘못했어. 용서해. 알았을 땐 너무 늦었어. 훔친 거 다 돌려줘... 몇 달은 살겠지만 요즘같이 크리스마스 때는 감방도 괜찮아... 케이크를 주고 귤도 줘... 당신 귤 좋아하잖아... 포기해, 제발.","s":"도둑아내"},"464":{"t":"남    자 : 아내라니! 그냥 여자라도 문젠데... 아내가 둘이란 걸 어떻게 말해.","s":"남자"},"465":{"t":"도둑아내 : 아내가 둘이라니, 누가요?","s":"도둑아내"},"466":{"t":"도    둑 : (공포에 질려 목소리가 올라간다) 나하곤 상관없어. 저 사람이 시킨 거야. 자기 부인이 알면 큰일난다고, 모르는 여자를 내 아내로... 그냥 아내로....","s":"도둑"},"467":{"t":"도둑아내 : 총 이리 줘요. 못된 버릇을 고쳐주지. (남자에게서 총을 빼앗아 남편을 겨눈다) 흥, 배신자, 거짓말쟁이, 악질 분자.... 딴 마누라를 숨겨두고 나하고 잘 살 거라고 생각했어... 이 멍청이... 내가 죽여주지. (안전장치를 풀려고 애쓴다) 이거 왜 안되죠?","s":"도둑아내"},"468":{"t":"남    자 : (해맑게) 가르쳐 드리죠... (총을 받는다) 우선 안전핀을 빼야되고, 총알이 잘 있나 확인을 해야돼요. 젠장, 내가 지금 뭐하는 거야? 제발, 소란 피우지 말아요. 다른 두 여자가 들으면 나나 당신 남편이나 끝장이오. 잠깐만 내 얘길 들어요. 자초지종은 설명 못해, 너무 길어서. 하지만 남편을 살리려면 가만히 있어요. (발소리가 점점 가까이 들린다) 이런, 벌써 나오잖아!","s":"남자"},"469":{"t":"안    나 : (들어오면서) 토르나티 선생님, 아리따운 부인이 기다려요... 파자마는 제가 직접 가져왔어요. 저도 남편하구... (말을 멈춘다. 도둑과 남편이 새로 나타난 손님을 안 보이게 가리려고 애쓰지만 안나는 이미 보고 놀라며) 여보... 이 분은 누구세요?","s":"안나"},"470":{"t":"남    자 : (그 존재를 모르는 듯) 누구?","s":"남자"},"471":{"t":"도둑아내 : 전 이 사람 아내, 마리아 토르나티에요.","s":"도둑아내"},"472":{"t":"안    나 : 네? 아내?","s":"안나"},"473":{"t":"남    자 : (상황을 호전시키려 하며) 말할 참이었어. 이 분은 자처하길...","s":"남자"},"474":{"t":"도둑아내 : 자처라뇨? 전 명실상부한 아내에요.","s":"도둑아내"},"475":{"t":"남    자 : 그러니까, 바로 내가 부인이셔... 아니, 저쪽이 부인이시라고... (마치 최면을 걸려는 듯 뚫어지게 쳐다보며) 첫 부인이시지... 내 친구 토르나토씨가...","s":"남자"},"476":{"t":"도    둑 : (수정하여) 티.","s":"도둑"},"477":{"t":"남    자 : (확신 없이) 토-티.","s":"남자"},"478":{"t":"도    둑 : 티, 티, 티, 토르나티.","s":"도둑"},"479":{"t":"남    자 : ... 첫부인으로 지금은 이혼하셨고.","s":"남자"},"481":{"t":" 도둑의 아내가 끼어들려 하자, 남편이 팔꿈치로 찌른다.","s":null},"483":{"t":"안    나 : 아... 외국 국적을 가졌어요?","s":"안나"},"484":{"t":"도    둑 : 음, 아녜요... 우린...","s":"도둑"},"485":{"t":"안    나 : 근데, 어떻게 이중결혼에다가 이혼도 가능했죠?","s":"안나"},"486":{"t":"도    둑 : (남자에게 도움을 청하며) 네? 가능했던 건...","s":"도둑"},"487":{"t":"남    자 : (도둑의 아내를 향하여) 가능했던 건...","s":"남자"},"488":{"t":"안    나 : 아... 친구 분이... 영화 일을 하시나 보다.","s":"안나"},"489":{"t":"남    자 : 응, 그래. 영화 일 영화제작자야.","s":"남자"},"490":{"t":"안    나 : 아, 제작자! 어떤 영화를 만드세요? 손에 든게... (파자마를 건네며) 잠시만요... 평소에 자루를 들고 다니시나보다... (은스푼을 꺼낸다) 어디서 많이 보던건데...","s":"안나"},"491":{"t":"도둑아내 : (도둑에게) 예쁘다. 선물?","s":"도둑아내"},"493":{"t":" 안나는 은스푼이 본인 것임을 알아챈다.","s":null},"495":{"t":"안    나 : 내 은스푼! 어찌된거죠?","s":"안나"},"496":{"t":"도    둑 : 훔친 거죠.","s":"도둑"},"497":{"t":"남    자 : 아니, 그게... 말했잖아.. 영화 제작자라고... 새로 만드는 영화에서 주제가... 그중에 절도 장면이 있는데... 나한테 보여 준다면서...","s":"남자"},"498":{"t":"안    나 : 재밌네요. 그러니 전문가죠.","s":"안나"},"499":{"t":"도    둑 : 네, 저희 토르나티 집안 대대로.","s":"도둑"},"500":{"t":"안    나 : (도둑에게) 부인도?","s":"안나"},"501":{"t":"도둑아내 : 전... 아녜요. (으쓱이며) 남편이 집에서 쉬라고...","s":"도둑아내"},"502":{"t":"안    나 : 아니, 이혼 문제 말예요. 이혼했는데 어째서 아직 아내로 있는지... 두 사람이 아내라니...","s":"안나"},"503":{"t":"남    자 : 분명히... 이혼했고... 재혼했지만... 민법보다 상위법인 교회법은 이혼을 인정 안했지. 그러니 민법에서는 이미 재혼이 인정됐지만... 불쌍한 이 친구, 졸지에 중혼자에다 간통법에, 공공질서 파괴범이 되다보니 독실한 카톨릭 신자가 됐지.","s":"남자"},"504":{"t":"도둑아내 : 뭐! (남편에게) 그런 말 일체 안했잖아.","s":"도둑아내"},"505":{"t":"도    둑 : 나도 몰랐어. (집주인에게) 독실한 중혼자란 뭐요?","s":"도둑"},"507":{"t":" 도둑은 남자쪽으로 이동하여 도둑 아내와 위치를 바꾼다.","s":null},"509":{"t":"안    나 : (도둑의 아내에게) 부인한테는 그편이 낫죠. 때로는 모르는 게 약이에요. 알아도 이해 못하고... 결말이 어떻게 날지... 아마 재판이 열리면 감옥에 가겠죠. 좀도둑 경우처럼","s":"안나"},"510":{"t":"남    자 : 그럴걸. 스푼을 훔치는 누구처럼... (꼭 집어서 말하듯) 그냥 마누라 하나 잘못둬서 말야.","s":"남자"},"511":{"t":"안    나 : 네?","s":"안나"},"512":{"t":"남    자 : 아니, 마누라가 둘이라서. 하하","s":"남자"},"513":{"t":"안    나 : (도둑에게) 참, 다른 부인한테 첫 부인이 온 걸 알려야죠. (도둑의 아내를 가리키며) 안 됐어요. 우린들 뭐 별 방도가 있나요. 설령 다들 좋다고 해도... 더블베드라, 아무래도 같이 자기엔 불편할 텐데.","s":"안나"},"514":{"t":"남    자 : 어떻게든 해 봐야지.","s":"남자"},"515":{"t":"도둑아내 : 당신... 이번 일은 그냥 못 넘어갈 줄 알어.","s":"도둑아내"},"516":{"t":"도    둑 : (자루를 들고 가고 싶어도 왼쪽에 난 문으로 아내를 끌고 가기 위해서는 두고 갈 수 밖에 없다) 그래. 어쨌든 나가자고. 제기랄! 수입 잡은 걸 두고 가다니!","s":"도둑"},"517":{"t":"남    자 : (도둑의 아내에게) 가시다니... 만나야죠, 남편 부인을... 음... 이쪽으로...","s":"남자"},"518":{"t":"도둑아내 : 잘난 낯짝 한 번 보자고.","s":"도둑아내"},"519":{"t":"도    둑 : (한탄을 하며 따라간다) 어휴 이씨.","s":"도둑"},"520":{"t":"안    나 : (세 사람이 나가는 것을 보고 연민에서 고개를 젓는다) 여자가 불쌍해! (이내 탁자 위에 흩어져 있는 병을 보고) 엉망이네, 술들 마셨나 봐.","s":"안나"},"522":{"t":" 술을 한잔 따른다. 그 사이 웬 남자가 문간에 나타나서 휘파람을 부른다.","s":null},"524":{"t":"안토니오 : 안나... 혼자야?","s":"안토니오"},"525":{"t":"안    나 : 아니, 안토니오. 말도 없이 여기 어쩐 일이야. 미쳤어? 가. 빨리... 남편 여기 있어.","s":"안나"},"526":{"t":"안토니오 : 대체 무슨 일이야? 전화에다 한 얘긴 종잡을 수가 없어. 내 마누라가 전화를 했다니? ","s":"안토니오"},"527":{"t":"안    나 : 아냐, 오해였어. 어떤 여자가 나한테 전화해서 마구 욕을 하잖아. 난, 자기 부인인 줄 알고.","s":"안나"},"528":{"t":"안토니오 : 그 여자가 내 마누란 줄 알았다고?","s":"안토니오"},"529":{"t":"안    나 : 나야 거기 얼굴을 아나, 목소리도 모르니 겁이 덜컥 났지. 어쨌든 여기 있으면 안돼. 가, 어서, 내일 봐.","s":"안나"},"530":{"t":"안토니오 : 나보고 꺼지라고? 그렇겐 안돼. 내가 그렇게 얼간이로 보여? 걸려온 전화는 오해였고, 남편도 지네 엄마 집이 아니라 여기 있다... 그렇다면, 무슨 내막이 있겠지. 내 생각을 털어나봐? 우리 약속을 취소한 건 여기서 딴 놈을 만나려는 수작 아냐? 누구인지는 몰라도 남편은 아냐.","s":"안토니오"},"531":{"t":"안    나 : 미쳤어. 어떻게 그런...","s":"안나"},"532":{"t":"안토니오 : 거짓말 마... 술잔은 뭐야? 이게 증거지. 영적 교감을 위한 준비였겠지. 그 놈 어딨어? 이름은? (어깨를 잡는다) 말해! 어떤 놈이야?","s":"안토니오"},"534":{"t":" 그때 도둑이 겨드랑이에 파자마를 끼고 나타난다. 자루를 찾으러 왔다. 그러나 새로 나타난 손님이 실랑이를 하는 걸 보자 겁에 질려 자루를 떨어뜨리고, 그 소리에 안토니오가 돌아본다.","s":null},"536":{"t":"도    둑 : 방해하려든 게 아니고, 자루 땜에...","s":"도둑"},"537":{"t":"안토니오 : 오, 이 친구야... 파자마까지. 젊은 양반, 준비가 끝났네.","s":"안토니오"},"538":{"t":"도    둑 : (팔을 움켜쥐는 안토니오에게) 잠깐만요, 이건 저 부인이 주신 거요. 원하시면 가져요. 파자마 땜에 흥분할 필요야 없죠.","s":"도둑"},"539":{"t":"안토니오 : 그거... 저 사람이 준 거, 나도 알아! 너희 둘은 대가를 치러야 돼. 가만히 있어. (이 말을 끝내자 문을 잠근다) 해명해. 그 전엔 못 나가.","s":"안토니오"},"540":{"t":"안    나　: 왜 그래... 내 이렇게 빌어... 이건 순전히 오해야. 이 분은 남편 친구 분이시구, 부인네들하고 함께...","s":"안나"},"542":{"t":" 다른 방에서 두 여자가 다투는 소리가 들린다.","s":null},"544":{"t":"도둑아내 : 내가 촌닭이라고... 얻다가 그따위 소릴. 이 거지 같은 게... ","s":"도둑아내"},"545":{"t":"여    자 : 뭐? 거지? 말조심해. 내가 누군지 알아?","s":"여자"},"546":{"t":"안토니오 : 전부... 당신 부인이요? 몇 명이나...","s":"안토니오"},"548":{"t":" 도둑은 꽤 많다는 표시인 양 손짓을 한다.","s":null},"550":{"t":"안    나 : 제발... 남편에겐 아무 말씀도 말아주세요.","s":"안나"},"551":{"t":"도    둑 : 입 다물죠.","s":"도둑"},"552":{"t":"안토니오 : 관대하시군요. 오해해서 미안해요.","s":"안토니오"},"553":{"t":"도    둑 : 이번 오해는 또 어떤 거예요? 오늘 밤은 정말 이상해!","s":"도둑"},"554":{"t":"안    나 : 이제 가. 열쇠 어딨지?","s":"안나"},"555":{"t":"안토니오 : 코트에. (주머니를 뒤진다) 이런, 제기랄! 여기 구멍이 났어. 속으로 들어갔잖아! 서 있지만 말고 좀 거들어.","s":"안토니오"},"557":{"t":" 열쇠를 쉽게 찾으려고 코트를 벗는다. 세 사람이 합동하지만, 열쇠는 생명이 있는 듯 그들의 손아귀를 벗어난다.","s":null},"559":{"t":"안토니오 : 어딜 만져?","s":"안토니오"},"560":{"t":"도    둑 : 좀 가만히 있어봐요.","s":"도둑"},"561":{"t":"안    나 : 잡았어! 어, 왜 내 손을 떨쳐.","s":"안나"},"562":{"t":"도    둑 : 가만, 여기예요. 어, 어디 갔지?","s":"도둑"},"563":{"t":"안토니오 : 살살 해요. 안감 다 찢어져요. 이젠 소매로 갔어.","s":"안토니오"},"565":{"t":" 옆방의 목소리가 점점 가까워진다.","s":null},"567":{"t":"안    나 : 사람들이 나와. 어쩌지?","s":"안나"},"568":{"t":"도    둑 : 이리 와요. 난 두시간이나 있었어요. 여기. (추시계를 연다) 편히 쉬어요. (그를 밀어 넣으며) 시계가 칠 땐 조심해요. 얻어맞지 않게... 담배는 금물이오!","s":"도둑"},"570":{"t":" 두 여자가 들어오자 남자는 그 뒤를 따른다. 그들은 떨떠름한 표정이다.","s":null},"572":{"t":"도둑아내 : (남편에게) 여기 두 사람은 입을 다물고 있으니, 집에 가서 당신이 해명해.","s":"도둑아내"},"573":{"t":"도    둑 : 집에? 왜 벌써 가? 여기 재밌잖아. 사람들도 좋고. 봐, 파자마도 줬어. 하여간 여길 못 나가. 열쇠가 없어.","s":"도둑"},"574":{"t":"도둑아내 : (화를 내며) 자물쇠 따는 거야, 당신 전공 아냐?","s":"도둑아내"},"576":{"t":" 도둑은 주머니에서 커다란 열쇠 꾸러미를 꺼낸다.","s":null},"578":{"t":"도    둑 : 이걸로 될까?","s":"도둑"},"579":{"t":"안    나 : (남편에게) 웬 열쇠 뭉치죠?","s":"안나"},"580":{"t":"남    자 : 말했잖아, 영화제작자라고. 제작자쯤 되면 보통 사무실 대여섯 개, 별장 두세 개, 잠자리도 두세 군데는 되지.","s":"남자"},"582":{"t":" 바로 그때 시계가 친다. 첫 번째 칠 때 비명이 들린다. 시계 안에 있던 불운한 안토니오가 머리를 어루만지며 밖으로 나온다.","s":null},"584":{"t":"안토니오 : 아야. 아...","s":"안토니오"},"585":{"t":"도    둑 : 조심하라 그랬죠. 머리가 깨져도 이 집에선 시원한 물도 못 얻어 마시니까.","s":"도둑"},"586":{"t":"여    자 : (시계에서 나온 안토니오를 보자 혼비백산하여) 저 사람이! (태연한 척하며) 여보!","s":"여자"},"587":{"t":"안토니오 : 줄리아! 당신... 여기 웬일이야?","s":"안토니오"},"588":{"t":"안    나 : 아세요... 토르나티씨 부인을?","s":"안나"},"589":{"t":"안토니오 : 누구 부인? 농담도... 내 아내요.","s":"안토니오"},"590":{"t":"남    자 : (그의 아내에게 돌아서며) 신경 쓸 것 없어. 무슨 오해가 있겠지.","s":"남자"},"591":{"t":"도    둑 : 또! 오늘 밤은 오해의 연속이야.","s":"도둑"},"592":{"t":"여    자 : 시계 속에서 뭘 했어요? (도둑에게) 아까 저 안에 있을 때 저 사람도 같이 있었어요?","s":"여자"},"593":{"t":"도    둑 : (순간적으로 당황하더니) 글쎄요... 안이 하도 어두워서...","s":"도둑"},"594":{"t":"남    자 : 아, 이제 알았어. 제가 오해를 말끔히 풀어드리죠. 그러니까...","s":"남자"},"595":{"t":"도    둑 : 맙소사! 오해가 아녜요. 말하자면...","s":"도둑"},"597":{"t":" 말을 잇기도 전에 다른 사람들은 도둑이 각자의 사연을 밝힐까봐 급히 끼여든다.","s":null},"599":{"t":"안    나 : 그건 오해였어요. 분명히.","s":"안나"},"600":{"t":"안토니오 : 네, 친구들이 아직 덜 모여서 어리둥절한 통에, 괜히 엉뚱한 오해만 생겼죠.","s":"안토니오"},"601":{"t":"여    자 : 그거야 유치원 애라도 알겠네요..","s":"여자"},"602":{"t":"남    자 : 시시콜콜 무슨 해명이 필요하겠어요? 설명할 수 있다면 그건 오해가 아니죠.","s":"남자"},"604":{"t":" 다음 대사는 동시에 진행한다.","s":null},"606":{"t":"안    나 : (남자에게) 그니까. 무슨 설명이 필요하겠어요.","s":"안나"},"607":{"t":"남    자 : 아니 그러니까 저사람 누군데.","s":"남자"},"608":{"t":"안    나 : 그러는 당신은, 저 여자 누구에요? 아무리 생각해도 저 거지같은 남자 아내는 아니에요","s":"안나"},"609":{"t":"남    자 : 지금 그게 중요한게 아니잖아.","s":"남자"},"611":{"t":"여    자 : (안토니오에게) 그래서 당신 언제부터 여기 있었던 거에요?","s":"여자"},"612":{"t":"안토니오 : 아까 왜 저 남자랑 같이 나온거야? 그거부터 얘기해.","s":"안토니오"},"613":{"t":"여    자 : 제발, 솔직하게 얘기해줘요. 이건 우리 둘 사이의 문제에요.","s":"여자"},"614":{"t":"안토니오 : 문제 좋아하시네, 먼저 문제를 만든 게 누군데.","s":"안토니오"},"616":{"t":"도    둑 : (그의 아내에게) 나가자구.","s":"도둑"},"617":{"t":"도둑아내 : 가만, 그렇게 당기지 마.","s":"도둑아내"},"618":{"t":"도    둑 : 눈치채기 전에 빨리 가.","s":"도둑"},"620":{"t":" 전등 스위치 옆을 지날 때 불을 끈다.","s":null},"622":{"t":"안    나 : (당황하며) 누가 껐어?","s":"안나"},"623":{"t":"여    자 : 무슨 일이지?","s":"여자"},"624":{"t":"안토니오 : 잡아! 그 두 사람 어딨어?","s":"안토니오"},"625":{"t":"여    자 : 그 남자, 제 정신 아냐. 지금쯤... 자수할 지도 몰라.","s":"여자"},"626":{"t":"남    자 : 빨리 잡아. 보내면 안돼.","s":"남자"},"627":{"t":"여    자 : 정원 쪽으로 도망가네요... 쫒아가요.","s":"여자"},"628":{"t":"남    자 : 이미 글렀어. 자, 두 사람은 저리 가시고, 안나... 아 안나! 당신은 이리 와.","s":"남자"},"629":{"t":"여    자 : (안토니오에게) 우린 어떡하죠?","s":"여자"},"631":{"t":" 모두 나간다. 창문에 불빛이 비친다. 불빛은 바로 거실로 들어와 도둑의 장물이 담긴 자루 위에 멈춘다. 바로 그때 사람들이 되돌아온다.","s":null},"633":{"t":"도    둑2 : 야, 이런 집도 있네! 이게 다 뭐야! 자루도 챙겨놨어. 은스푼도 있잖아! 자상하기라도 하지. ","s":"도둑2"},"634":{"t":"안    나 : 안에 누가 있는데요?","s":"안나"},"635":{"t":"여    자 : 도둑 아니에요?","s":"여자"},"636":{"t":"도   둑2 : 누가 오잖아!","s":"도둑2"},"637":{"t":"남    자 : 그 도적놈이 창문으로 다시 왔어. 물건을 가지러.","s":"남자"},"638":{"t":"안    나 : 붙잡아요.","s":"안나"},"639":{"t":"여    자 : 빨리 잡아요.. 도망 못가게.","s":"여자"},"640":{"t":"안    나 : 어디에요, 어디.","s":"안나"},"642":{"t":" 다음 대사는 동시에 진행 한다.","s":null},"644":{"t":"도   둑2 : 아 잠깐만요. 아 거기있어! 거기 만지지 마요! 아 거기 아니야. 아 만지지 말아봐요. 잠깐만요. 아 때리지 말아요. 가만히 있어봐! 아!","s":"도둑2"},"645":{"t":"안    나 : (비명을 지르며) 왜왜 뭐가 있는데! 여기 있다! 아니야 잠깐만, 이거 사람 손 아니야? 으악! 누가 내 팔 잡았어! 어디야 도대체! 불 좀 켜요! 아무것도 안 보여!","s":"안나"},"646":{"t":"여    자 : (비명을 지르며) 뭐야! 어디야! 나도 봤어! 방금 뭐 지나갔어! 왜 밀어요! 이거 사람 아니야? 아니야? 누가 불 좀 켜봐요!","s":"여자"},"647":{"t":"안토니오 : 잠깐만요! 다들 진정하세요! 이러다 다쳐요! 한 명씩 말해요, 한 명씩! 아니 근데 진짜 어디 있다는 거에요!","s":"안토니오"},"648":{"t":"남    자 : 잡아! 거기다! 아니야 이쪽이야! 창문 막아! 도망간다니까! 아니 누가 좀 잡아봐! 왜 다들 소리만 질러!","s":"남자"},"650":{"t":" 불이 들어오면, 네 추적자가 도둑2를 포위하고 있다.","s":null},"652":{"t":"안    나 : 이 사람... 저명한 토르나티씨가 아닌다.","s":"안나"},"653":{"t":"도   둑2 : 아무리 함정수사라 해도, 이건 너무해 창문을 열어 놓구, 물건도 챙겨 놓구. 내가 움직이는 순간에, 빠방! 미모의 여형사가 등장해... 아냐 아냐, 이건 장난이 아냐. 우리 노조에 보고 할거야. 다들 안녕히 계세요.","s":"도둑2"},"654":{"t":"일    동 : 안돼!!!","s":"일동"},"655":{"t":"남    자 : 젠장, 이건 오해라니깐.","s":"남자"},"656":{"t":"도   둑2 : 뭐요?","s":"도둑2"},"657":{"t":"일    동 : 오해라구","s":"일동"},"658":{"t":"남    자 : 자초지종을 설명하죠.","s":"남자"},"659":{"t":"일    동 : 말하자면...","s":"일동"},"661":{"t":" 다음 대사 역시 동시에 말해지기 때문에 한 마디도 이해할 수 없어 소음같이 들린다.","s":null},"663":{"t":"여    자 : 초저녁에 남편하고 같이 있는데 전화가 왔어요. 당장 이리 오라고. 처음에는 당연히 안가려고 했죠. 저 전화 한통에 달려가는 그런 쉬운사람 절대 아니거든요...? 근데... 마침 남편이 영화를 보러 간다는거에요.. 같이가자 하려했는데.. 그때 걸려온 전화가 신경쓰였어요... 결국, 저는 그 남자에게 가고 말았어요... 하지만! 저는 정말 안가려고 했다니까요? 안토니오가 영화만 안보러갔어도 이런 일은 없었을거에요. ","s":"여자"},"664":{"t":"안    나 : 별장에 있는데 전화가 왔어요. 받았더니 느닷없이 욕을 퍼붓는데... 듣다보니까 열이 받더라고요? 근데 자세히 듣다보니 내 남편하고 관련된 일 같은 거에요. 그때 깨달았죠. 이 사람 또 뭔가 사고를 쳤구나. 전에도 그이가 바람펴서 이혼할 뻔 했거든요. 그때만 생각하면 정말... 네? 안토니오요? 갑자기 그 사람 얘기를 왜꺼내요! 그건 그거고 이건 이거죠. 하도 저 좋다고 따라다니길래, 어제 한번 만나준거. 그게 다거든요??","s":"안나"},"665":{"t":"남    자 : 어머님 댁에 있었죠. 저녁을 먹으려는데, 문득 사무실 열쇠를 집에 두고 온게 생각이 나서 집으로 돌아가려 했죠. 그런데 생각해보니 내 집에는 아무도 없는거죠. 분명히 안나는 별장에 있고, 내가 어머니 댁에 있는걸로 아니까. 이건 하늘이 주신 기회였어요. 곧장 줄리아에게 전화를 했죠. 줄리아요? 어자피 제가 전화하면 고민도 안하고 달려오는 그런 쉬운 사람이에요.","s":"남자"},"666":{"t":"안토니오 : 일찌감치 영화관에 갔죠. 늘 보는 그런 거 있잖아요. 폭력, 선전... 그런데 그때는 유독 집중이 안되는 거에요. 사실 내 마누라 줄리아와 있기 싫어서 영화관으로 도망친거였거든요. 안나가, 어제밤에 만났던 그녀가 자꾸 내 머릿속을 맴돌더라구요. 무시하려했죠.. 하지만, 참을 수가 없었어요. 곧장 안나가 있는 빌라로 가지 않고서는 못베기겠어서... 결국 가려고 마음 먹었죠. 그런데 마침 안나에게 전화가 온거에요. 이건 기회였어요.","s":"안토니오"},"668":{"t":" 왁자지껄한 목소리와 의미없는 말의 공세에 압도당한 도둑2는 뒤로 물러나다가 소파에 부딪힌다. 처음엔 주저앉았다가 다음엔 드러눕게 된 도둑 2에다 대고 불성실한 네 사람은 거짓말을 줄줄이 쏟아낸다.","s":null},"670":{"t":" 암전.","s":null}},"questions":[{"id":"Q1","topic":"왼쪽 윙 ↔ 뒷벽 뒤 연결","why":"도둑아내가 2차 통화(L242) 후 왼쪽 윙에서 현관(L458)까지 가야 한다. 연결이 없다면 객석 출입구·로비를 돌아야 한다."},{"id":"Q2","topic":"무대 실측 치수","why":"run_limit(한 beat 최대 3칸)·crowd_limit(구역당 3명)은 치수 없이 정한 보수적 기준이다."},{"id":"Q3","topic":"추시계 내부 크기·문 방향","why":"도둑·안토니오가 들어가고, 추에 머리를 맞는 연출(L169, L277, L582)이 있다. 소품찾기 메모: '안토니오가 들어가기엔 좀 비좁다는 느낌이면 재밌을 듯'."},{"id":"Q4","topic":"소품표에 없는 소품","why":"수첩(L235), 안토니오 열쇠(L539)는 대본에 있으나 최종 소품표에 없다."},{"id":"Q5","topic":"공연 영상 확인","why":"막공 영상 P1522195.MP4(2GB)는 이 환경에 ffmpeg가 없어 분석하지 못했다. 실제 공연 동선과 대조하면 검증 정확도가 오른다."}],"validation":{"errors":0,"warnings":[{"code":"W-DIM","beat":"-","msg":"무대 치수 미확정 — 상대 그리드 기준 검증. 실측 후 run_limit/crowd_limit 재조정 필요"},{"code":"W-UNCONF","beat":"S5-01","msg":"도둑아내: 미확인 경로 WING_L↔OFF_L (왼쪽 윙 ↔ 뒷벽 뒤)"},{"code":"W-LINE","beat":"S9-01","msg":"3명이 한 줄로 늘어섬 {'도둑': 'M1', '도둑아내': 'M2', '남자': 'M3'} — 깊이(B/M/F)를 섞거나 의도 명시"},{"code":"W-PROP-LIST","beat":"S4-09","msg":"235행 '수첩'는 최종 소품표에 없음 — 준비 여부 확인"},{"code":"W-PROP-LIST","beat":"S10-08b","msg":"539행 '안토니오 열쇠'는 최종 소품표에 없음 — 준비 여부 확인"}],"moves":146,"events":118}}</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById("blocking-data").textContent);
  const COLORS = { T: "#c05428", W: "#b03a68", M: "#2f5ea6", F: "#7a50a0", A: "#1e7c70", N: "#7a5440", T2: "#566070" };
  const NAMES = Object.keys(D.characters);
  const code = (n) => D.characters[n].code;
  const color = (n) => COLORS[code(n)] || "#666";
  const COLX = { 1: 188, 2: 344, 3: 500, 4: 656, 5: 812 };
  const ROWY = { B: 204, M: 318, F: 434 };
  const OFF = { OFF_L: [300, 58], OFF_R: [700, 58], WING_L: [58, 434], HOUSE_ENTRY: [150, 724], AUD_C: [500, 600], CLOCK_IN: [656, 160] };
  const KIND = { OFF_L: "off", OFF_R: "off", WING_L: "off", HOUSE_ENTRY: "off", AUD_C: "house", CLOCK_IN: "hidden" };
  const LABEL = { OFF_L: "무대 뒤 왼쪽", OFF_R: "현관 밖", WING_L: "왼쪽 마스킹 뒤", HOUSE_ENTRY: "객석 출입구", AUD_C: "객석 중앙 통로", CLOCK_IN: "추시계 안" };
  const label = (n) => LABEL[n] || n;
  const xy = (n) => OFF[n] ? OFF[n].slice() : [COLX[n[1]], ROWY[n[0]]];
  const kind = (n) => KIND[n] || "zone";
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const lineOf = (trig) => { const m = /^L(\d+)/.exec(trig || ""); return m ? +m[1] : null; };
  const restOf = (trig) => String(trig || "").replace(/^L\d+\s*/, "");
  const span = (b) => b.lines[0] === b.lines[1] ? `L${b.lines[0]}` : `L${b.lines[0]}–${b.lines[1]}`;
  const scenesById = Object.fromEntries(D.scenes.map((s) => [s.id, s]));

  let idx = 0, who = null;
  try { const w = localStorage.getItem("dd-who"); if (w && D.characters[w]) who = w; } catch (e) {}

  // ---------- 제목 ----------
  const pm = /^(.*?)\s*「(.*?)」\s*\((.*)\)$/.exec(D.production) || [];
  document.getElementById("company").textContent = (pm[1] || "") + " · 3차 각색 대본";
  document.getElementById("play").textContent = pm[2] || "도덕적 도둑";
  document.getElementById("credit").textContent = (pm[3] || "").replace(/,\s*/g, " · ");
  const V = D.validation;
  document.getElementById("meta").innerHTML =
    `<span class="ver">Blocking ${esc(D.version)}</span>${D.based_on ? ` <span>(${esc(D.based_on)} 개선)</span>` : ""}<br>` +
    `beat <b>${D.beats.length}</b> · 이동 <b>${V.moves}</b> · 대본 대조 <b>${V.events}</b>건<br>` +
    `자동 검증 오류 <b>${V.errors}</b> · 확인 대기 경고 <b>${V.warnings.length}</b>`;
  document.getElementById("foot").textContent = "무대 정보·분석·검증 기록은 하네스 저장소 blocking/ 폴더에 있습니다. 이 페이지는 blocking/tools/build_viewer.py 로 생성됩니다.";

  // ---------- 눈금자 ----------
  const ruler = document.getElementById("ruler");
  ruler.innerHTML = D.scenes.map((s) => {
    const items = D.beats.map((b, i) => [b, i]).filter(([b]) => b.scene === s.id);
    const w = items.reduce((t, [b]) => t + Math.max(b.lines[1] - b.lines[0] + 1, 3), 0);
    const bts = items.map(([b, i]) => `<button type="button" class="bt" data-i="${i}" style="flex-grow:${Math.max(b.lines[1] - b.lines[0] + 1, 3)}" title="${esc(b.id)} · ${esc(span(b))} · ${esc(b.summary)}" aria-label="${esc(b.id)} ${esc(span(b))}"></button>`).join("");
    return `<div class="sc" data-scene="${esc(s.id)}" style="flex:${w} 1 0"><span class="sc-l" title="${esc(s.id + " " + s.title)}"><span class="mono">${esc(s.id.slice(1))}</span>${esc(s.title)}</span><div class="bts">${bts}</div></div>`;
  }).join("");
  ruler.addEventListener("click", (e) => { const b = e.target.closest(".bt"); if (b) go(+b.dataset.i); });
  const first = D.beats[0].lines[0], last = D.beats[D.beats.length - 1].lines[1];
  document.getElementById("scale").innerHTML = `<span>L${first}</span><span>대본 줄 수에 비례 · 장면 번호와 제목</span><span>L${last}</span>`;

  // ---------- 인물 ----------
  const cast = document.getElementById("cast");
  cast.innerHTML = `<span class="lab">인물</span><button type="button" class="per" data-who="">전체</button>` +
    NAMES.map((n) => `<button type="button" class="per" data-who="${esc(n)}" style="--c:${color(n)}" title="${esc(D.characters[n].actor)}"><i></i>${esc(n)}</button>`).join("");
  cast.addEventListener("click", (e) => {
    const b = e.target.closest(".per"); if (!b) return;
    who = b.dataset.who || null;
    try { who ? localStorage.setItem("dd-who", who) : localStorage.removeItem("dd-who"); } catch (err) {}
    render();
  });
  document.getElementById("prev").addEventListener("click", () => go(idx - 1));
  document.getElementById("next").addEventListener("click", () => go(idx + 1));
  document.addEventListener("keydown", (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey || e.target.closest("input, textarea, select")) return;
    if (e.key === "ArrowLeft") { go(idx - 1); e.preventDefault(); }
    if (e.key === "ArrowRight") { go(idx + 1); e.preventDefault(); }
  });
  const rail = document.getElementById("rail");
  const setRail = () => document.documentElement.style.setProperty("--rail-h", rail.offsetHeight + "px");
  if (window.ResizeObserver) new ResizeObserver(setRail).observe(rail);
  setRail();

  // ---------- 평면도 (고정 부분) ----------
  function curtain(x1, x2, y) {
    const pts = []; for (let x = x1, k = 0; x <= x2; x += 7, k++) pts.push(`${x},${y + (k % 2 ? 4 : -4)}`);
    return `<polyline class="s-curtain" points="${pts.join(" ")}"/>`;
  }
  const STATIC = (() => {
    const t = [];
    t.push(`<defs>
      <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="s-hatch" x1="0" y1="0" x2="0" y2="7"/></pattern>
      <radialGradient id="spotG"><stop offset="0" class="sp0"/><stop offset="1" class="sp1"/></radialGradient>
      ${NAMES.map((n) => `<marker id="ar-${code(n)}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${color(n)}"/></marker>`).join("")}
    </defs>`);
    // 무대 뒤, 마스킹 (빗금)
    t.push(`<rect x="110" y="20" width="780" height="78" fill="url(#hatch)"/>`);
    t.push(`<text class="s-t" x="120" y="40">무대 뒤 — 안쪽 방 · 창문 밖</text><text class="s-t" x="880" y="40" text-anchor="end">현관 밖 · 정원 — 무대 뒤</text>`);
    t.push(`<text class="s-t sm" x="500" y="88" text-anchor="middle">뒷벽 뒤 통로 (좌우 연결)</text>`);
    t.push(`<rect x="20" y="112" width="80" height="380" fill="url(#hatch)"/><rect x="900" y="112" width="80" height="380" fill="url(#hatch)"/>`);
    t.push(`<text class="s-t" x="60" y="132" text-anchor="middle">왼쪽</text><text class="s-t" x="60" y="148" text-anchor="middle">마스킹</text>`);
    t.push(`<text class="s-t" x="940" y="132" text-anchor="middle">오른쪽</text><text class="s-t" x="940" y="148" text-anchor="middle">마스킹</text>`);
    // 무대 바닥
    t.push(`<rect class="s-floor" x="110" y="112" width="780" height="380"/>`);
    [266, 422, 578, 734].forEach((x) => [254, 374].forEach((y) => t.push(`<path class="s-cross" d="M${x - 5} ${y}h10M${x} ${y - 5}v10"/>`)));
    ["B", "M", "F"].forEach((r, ri) => [1, 2, 3, 4, 5].forEach((c) => t.push(`<text class="s-zone" x="${110 + c * 156 - 8}" y="${[248, 368, 486][ri]}" text-anchor="end">${r}${c}</text>`)));
    // 뒷벽: 판넬, 창문, 커튼문
    [[110, 298], [390, 766], [858, 890]].forEach(([a, b]) => t.push(`<rect class="s-wall" x="${a}" y="108" width="${b - a}" height="12"/>`));
    t.push(`<rect class="s-win" x="140" y="109" width="96" height="10"/><line class="s-thin" x1="140" y1="114" x2="236" y2="114"/>`);
    t.push(curtain(300, 388, 114) + curtain(768, 856, 114));
    t.push(`<text class="s-t" x="188" y="142" text-anchor="middle">창문 (흉내)</text>`);
    t.push(`<text class="s-t" x="344" y="142" text-anchor="middle">커튼문 · 안쪽 방</text>`);
    t.push(`<rect class="s-brass" x="480" y="98" width="40" height="8"/><line class="s-thin" x1="444" y1="126" x2="556" y2="126"/>`);
    t.push(`<text class="s-t" x="500" y="142" text-anchor="middle">선반 · 초상화</text>`);
    t.push(`<rect class="s-out" x="630" y="121" width="52" height="78"/><circle class="s-brass" cx="656" cy="138" r="9"/><line class="s-thin" x1="656" y1="150" x2="656" y2="188"/>`);
    t.push(`<text class="s-t" x="690" y="142">추시계</text>`);
    t.push(`<text class="s-t" x="812" y="142" text-anchor="middle">커튼문 · 현관</text>`);
    t.push(`<rect class="s-brassf" x="866" y="128" width="8" height="12"/><text class="s-t sm" x="884" y="164" text-anchor="end">스위치</text>`);
    t.push(`<path class="s-thin" d="M890 180h-8M890 192h-8M890 204h-8"/><text class="s-t sm" x="878" y="222" text-anchor="end">옷걸이</text>`);
    // 가구 (윤곽)
    t.push(`<rect class="s-out" x="132" y="282" width="108" height="40"/><text class="s-t" x="186" y="307" text-anchor="middle">왼쪽 테이블</text>`);
    t.push(`<rect class="s-out" x="308" y="286" width="72" height="34"/><text class="s-t sm" x="344" y="308" text-anchor="middle">서랍·전화</text>`);
    t.push(`<path class="s-out" d="M430 292h140v50h-140z"/><line class="s-thin" x1="430" y1="302" x2="570" y2="302"/><text class="s-t" x="500" y="328" text-anchor="middle">소파</text>`);
    // 무대 앞 끝
    t.push(`<line class="s-edge" x1="110" y1="492" x2="890" y2="492"/>`);
    t.push(`<text class="s-t sm" x="886" y="510" text-anchor="end">무대 앞 끝 · 단</text><text class="s-t sm" x="500" y="512" text-anchor="middle">↑ 단 올라섬</text>`);
    // 객석
    ["A", "B", "C", "D", "E"].forEach((r, i) => {
      const y = 540 + i * 28;
      t.push(`<text class="s-zone" x="228" y="${y + 12}" text-anchor="end">${r}</text>`);
      for (let s = 0; s < 5; s++) t.push(`<rect class="s-seat" x="${240 + s * 44}" y="${y}" width="32" height="16" rx="2"/>`);
      for (let s = 0; s < 5; s++) t.push(`<rect class="s-seat" x="${544 + s * 44}" y="${y}" width="32" height="16" rx="2"/>`);
    });
    t.push(`<text class="s-t sm" x="500" y="692" text-anchor="middle">객석 50석 · 계단 통로 왼쪽 · 중앙 · 오른쪽</text>`);
    t.push(`<path class="s-thin" d="M126 740v-18a18 18 0 0 1 18 18"/><text class="s-t sm" x="152" y="748">출입구</text>`);
    return t.join("");
  })();

  function slots(n, flat) {
    if (flat) return Array.from({ length: n }, (_, i) => [(i - (n - 1) / 2) * 34, 0]);
    return [[[0, 0]], [[-20, 0], [20, 0]], [[-21, -13], [21, -13], [0, 18]], [[-20, -15], [20, -15], [-20, 18], [20, 18]]][n - 1]
      || Array.from({ length: n }, (_, i) => [Math.cos(i / n * 6.283) * 32, Math.sin(i / n * 6.283) * 28]);
  }
  function placed(positions) {
    const g = {}; NAMES.forEach((n) => (g[positions[n]] = g[positions[n]] || []).push(n));
    const out = {};
    Object.entries(g).forEach(([node, list]) => {
      const [x, y] = xy(node);
      slots(list.length, kind(node) === "off").forEach(([dx, dy], i) => (out[list[i]] = [x + dx, y + dy]));
    });
    return out;
  }
  const inSpot = (b) => D.reserved.some((r) => r.node === "F1" && b.lines[0] <= r.lines[1] && b.lines[1] >= r.lines[0]);

  function drawMap(b) {
    const t = [];
    if (inSpot(b)) t.push(`<circle cx="188" cy="434" r="62" fill="url(#spotG)"/><text class="s-t sm" x="188" y="482" text-anchor="middle">핀조명 · 통화석</text>`);
    const start = placed(b.start), end = placed(b.end);
    b.moves.forEach((m, k) => {
      const shift = (NAMES.indexOf(m.who) - 3) * 3;
      const nodes = m.path.filter((n, i) => i === 0 || n !== m.path[i - 1]);
      if (nodes.length < 2) return;
      const pts = nodes.map((n, i) => {
        if (i === 0) return start[m.who];
        if (i === nodes.length - 1) return end[m.who];
        const [x, y] = xy(n); return [x + shift, y + shift];
      });
      const dim = who && m.who !== who ? " dim" : "";
      t.push(`<polyline class="p-line${m.speed === "run" ? " run" : ""}${dim}" stroke="${color(m.who)}" marker-end="url(#ar-${code(m.who)})" points="${pts.map((p) => p.map((v) => v.toFixed(1)).join(",")).join(" ")}"><title>${k + 1}. ${esc(m.who)} ${esc(nodes.map(label).join(" → "))}</title></polyline>`);
      const [ax, ay] = pts[0], [bx, by] = pts[1];
      const len = Math.hypot(bx - ax, by - ay) || 1, d = Math.min(30, len * 0.45);
      const nx = ax + (bx - ax) / len * d, ny = ay + (by - ay) / len * d;
      t.push(`<g class="p-num${dim}"><circle cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="8.5" stroke="${color(m.who)}"/><text x="${nx.toFixed(1)}" y="${ny.toFixed(1)}" fill="${color(m.who)}">${k + 1}</text></g>`);
    });
    NAMES.forEach((n) => {
      if (b.start[n] === b.end[n] || kind(b.start[n]) === "off") return;
      const [x, y] = start[n];
      t.push(`<circle class="ghost${who && n !== who ? " dim" : ""}" cx="${x}" cy="${y}" r="14" stroke="${color(n)}"/>`);
    });
    NAMES.forEach((n) => {
      const node = b.end[n], [x, y] = end[n], k = kind(node);
      const off = k === "off", dim = who && n !== who ? " dim" : "";
      const fill = off ? "" : ` fill="${color(n)}"`, stroke = off ? ` stroke="${color(n)}"` : "";
      const tc = off ? color(n) : "#fff", fs = code(n).length > 1 ? 10.5 : 12.5;
      t.push(`<g class="tk${off ? " off" : ""}${dim}"><title>${esc(n)} (${esc(D.characters[n].actor)}) — ${esc(label(node))}</title>` +
        (k === "hidden" ? `<circle class="ring" cx="${x}" cy="${y}" r="19"/>` : "") +
        `<circle class="body" cx="${x}" cy="${y}" r="${off ? 12 : 15}"${fill}${stroke}/><text x="${x}" y="${y}" font-size="${fs}" fill="${tc}">${esc(code(n))}</text></g>`);
    });
    document.getElementById("map").innerHTML = `<svg viewBox="0 0 1000 760" role="img" aria-label="${esc(b.id)} 무대 평면도">${STATIC}${t.join("")}</svg>`;
    document.getElementById("ends").innerHTML = NAMES.map((n) => {
      const node = b.end[n], cls = [kind(node) === "off" ? "off" : "", who && n !== who ? "dim" : ""].join(" ").trim();
      return `<div class="${cls}" style="--c:${color(n)}"><dt><i></i>${esc(n)}</dt><dd title="${esc(label(node))}">${esc(label(node))}</dd></div>`;
    }).join("");
  }

  // ---------- beat 시트 ----------
  function propText(p) {
    const by = p.by ? ` (${esc(p.by)})` : "";
    if (p.to.startsWith("@")) return `${esc(p.prop)} → ${esc(label(p.to.slice(1)))}에 놓음${by}`;
    if (p.to.startsWith("in:")) return `${esc(p.prop)} → ${esc(p.to.slice(3))} 안에 넣음${by}`;
    return `${esc(p.prop)} → ${esc(p.to)} 손에`;
  }
  function route(m) { return m.path.filter((n, i) => i === 0 || n !== m.path[i - 1]).map((n) => esc(label(n))).join(" → "); }
  function numBadge(k, n) { return `<span class="num" style="--c:${color(n)}">${k + 1}</span>`; }

  function book(b) {
    const marks = {};
    b.moves.forEach((m, k) => { const l = lineOf(m.trigger); if (l != null) (marks[l] = marks[l] || []).push(numBadge(k, m.who)); });
    const cues = {};
    b.sound.forEach((c) => { const l = D.cue_lines[c]; if (l != null) (cues[l] = cues[l] || []).push(c); });
    const rows = [];
    for (let i = b.lines[0]; i <= b.lines[1]; i++) {
      const L = D.script[String(i)];
      if (!L) continue;
      const dir = /^[\s　]/.test(L.t);
      let tx;
      if (L.s && !dir) {
        const body = L.t.replace(/^[^:;：]*[:;：]\s?/, "");
        tx = `<span class="who" style="color:${D.characters[L.s] ? color(L.s) : "var(--ink)"}">${esc(L.s)}</span>${esc(body)}`;
      } else tx = esc(L.t.trim());
      const q = (cues[i] || []).map((c) => `<span class="q" title="${esc(D.sound[c] || "")}">${esc(c.replace("음향", "음향 "))}</span>`).join("");
      rows.push(`<div class="ln${dir ? " dir" : ""}${who && L.s === who ? " mine" : ""}"><span class="no">${i}</span><span class="mk">${(marks[i] || []).join("")}</span><span class="tx">${q}${tx}</span></div>`);
    }
    return rows.join("") || `<p class="still" style="border:0;padding:6px 16px">이 구간에는 대사가 없습니다.</p>`;
  }

  function focusLine() {
    if (!who) return "";
    const mine = D.beats.map((x, i) => [x, i]).filter(([x]) => x.moves.some((m) => m.who === who) || x.actions.some((a) => a.who === who));
    const nMoves = D.beats.reduce((s, x) => s + x.moves.filter((m) => m.who === who).length, 0);
    const p = [...mine].reverse().find(([, i]) => i < idx), n = mine.find(([, i]) => i > idx);
    return `<div class="focus" style="--c:${color(who)}"><span><b style="color:${color(who)}">${esc(who)}</b> · ${esc(D.characters[who].actor)}</span><span>이동 ${nMoves}회 · 등장 beat ${mine.length}개</span>
      <span><button type="button" data-jump="${p ? p[1] : ""}" ${p ? "" : "disabled"}>← 이 인물의 이전 동선</button></span>
      <span><button type="button" data-jump="${n ? n[1] : ""}" ${n ? "" : "disabled"}>다음 동선 →</button></span></div>`;
  }

  function drawSheet(b) {
    const sc = scenesById[b.scene] || { title: "" };
    const cueRows = [];
    if (b.sound.length) cueRows.push(`<div><dt>음향</dt><dd>${b.sound.map((c) => `<span class="mono">${esc(c.replace("음향", ""))}</span>${esc((D.sound[c] || "").replace(/^\[[^\]]*\]/, "").replace(/\.mp3$/, ""))}`).join(" &nbsp; ")}</dd></div>`);
    if (b.light) cueRows.push(`<div><dt>조명</dt><dd>${esc(b.light)}</dd></div>`);
    if (b.voices.length) cueRows.push(`<div><dt>목소리만</dt><dd>${esc(b.voices.join(", "))}</dd></div>`);
    const notes = b.moves.length
      ? `<ol class="notes">${b.moves.map((m, k) => `<li class="${who && m.who !== who ? "dim" : ""}">${numBadge(k, m.who)}<div>
          <div class="n1"><span class="nm" style="color:${color(m.who)}">${esc(m.who)}</span>${m.together ? `<span class="with">${esc(m.together)}와 함께</span>` : ""}<span class="route">${route(m)}</span>${m.speed === "run" ? `<span class="run">달려서</span>` : ""}</div>
          <p class="n2">${esc(m.purpose)}</p>
          <p class="n3">${lineOf(m.trigger) != null ? `<span class="mono">L${lineOf(m.trigger)}</span>` : ""}${esc(restOf(m.trigger))}</p></div></li>`).join("")}</ol>`
      : `<p class="still">자리 이동 없이 제자리 동작만 있는 beat입니다.</p>`;
    const acts = b.actions.length ? `<div><p class="h2">제자리 동작</p><ul class="acts">${b.actions.map((a) => `<li class="${who && a.who !== who ? "dim" : ""}"><span class="mono">L${esc(a.line)}</span><span><b style="font-weight:600">${esc(a.who)}</b> ${esc(a.what)}<span class="why">${esc(a.purpose || "")}</span></span></li>`).join("")}</ul></div>` : "";
    const props = b.props.length ? `<div><p class="h2">소품</p><ul class="props">${b.props.map((p) => `<li>${propText(p)}</li>`).join("")}</ul></div>` : "";
    document.getElementById("sheet").innerHTML = `
      <div class="bh">
        <div class="bh-top"><span class="bid">${esc(b.id)}</span><span class="bl">${esc(span(b))}</span></div>
        <div class="bs">${esc(b.scene.replace("S", "장면 "))} · ${esc(sc.title)}</div>
      </div>
      <p class="summary">${esc(b.summary)}</p>
      ${cueRows.length ? `<dl class="cues">${cueRows.join("")}</dl>` : ""}
      ${focusLine()}
      <div><p class="h2">동선 — 번호는 지도·대본 여백과 같다</p>${notes}</div>
      ${acts}${props}
      ${b.notes ? `<p class="aside">${esc(b.notes)}</p>` : ""}
      <div><p class="h2">대본 ${esc(span(b))}</p><div class="book">${book(b)}</div></div>`;
  }
  document.getElementById("sheet").addEventListener("click", (e) => {
    const j = e.target.closest("[data-jump]"); if (j && j.dataset.jump !== "") go(+j.dataset.jump);
  });

  // ---------- 끝 부분 ----------
  document.getElementById("qs").innerHTML = D.questions.map((q) => `<li><span class="mono">${esc(q.id)}</span><span><b>${esc(q.topic)}</b><span>${esc(q.why)}</span></span></li>`).join("");
  document.getElementById("ws").innerHTML = V.warnings.length
    ? V.warnings.map((w) => `<li><span class="mono">${esc(w.code)}${w.beat !== "-" ? "<br>" + esc(w.beat) : ""}</span><span>${esc(w.msg)}</span></li>`).join("")
    : `<li>없음</li>`;

  // ---------- 상태 ----------
  function render() {
    const b = D.beats[idx];
    document.getElementById("count").textContent = `${String(idx + 1).padStart(2, "0")} / ${D.beats.length}`;
    document.getElementById("prev").disabled = idx === 0;
    document.getElementById("next").disabled = idx === D.beats.length - 1;
    cast.querySelectorAll(".per").forEach((el) => el.setAttribute("aria-pressed", String((el.dataset.who || null) === who)));
    ruler.querySelectorAll(".sc").forEach((el) => el.classList.toggle("on", el.dataset.scene === b.scene));
    ruler.querySelectorAll(".bt").forEach((el) => {
      const i = +el.dataset.i, x = D.beats[i];
      el.setAttribute("aria-current", String(i === idx));
      const mine = who && x.moves.some((m) => m.who === who);
      el.classList.toggle("mine", !!mine);
      if (mine) el.style.setProperty("--c", color(who)); else el.style.removeProperty("--c");
    });
    drawMap(b);
    drawSheet(b);
  }
  function go(i) {
    if (i < 0 || i >= D.beats.length) return;
    idx = i;
    try { history.replaceState(null, "", "#" + D.beats[i].id); } catch (e) {}
    render();
  }
  const hi = D.beats.findIndex((b) => b.id === (location.hash || "").slice(1));
  idx = hi >= 0 ? hi : 0;
  render();
})();
</script>
